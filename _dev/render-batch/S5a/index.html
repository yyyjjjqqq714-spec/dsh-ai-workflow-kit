<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#111;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="320" height="180"></canvas>
<script>
const W = 320, H = 180
const c = document.getElementById('c')
const ctx = c.getContext('2d')
const id = new URLSearchParams(location.search).get('id') || 'S5-M3'

const F = {
  sans: '"Microsoft YaHei",sans-serif',
  serif: '"SimSun",serif',
  hand: '"KaiTi",serif',
  mono: '"Consolas",monospace',
}

/* 确定性随机（截图可复现） */
let _s = 12345
function rs (n) { _s = n }
function rnd () { _s = (_s * 1103515245 + 12345) & 0x7fffffff; return _s / 0x7fffffff }
function rn (a, b) { return a + (b - a) * rnd() }

function rr (x, y, w, h, r) {
  ctx.beginPath()
  ctx.moveTo(x + r, y)
  ctx.arcTo(x + w, y, x + w, y + h, r)
  ctx.arcTo(x + w, y + h, x, y + h, r)
  ctx.arcTo(x, y + h, x, y, r)
  ctx.arcTo(x, y, x + w, y, r)
  ctx.closePath()
}
function txt (s, x, y, font, color, align, base) {
  ctx.font = font
  ctx.fillStyle = color
  ctx.textAlign = align || 'left'
  ctx.textBaseline = base || 'alphabetic'
  ctx.fillText(s, x, y)
}
function dot (x, y, r, col) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fillStyle = col; ctx.fill()
}
function line (x1, y1, x2, y2, col, lw, dash) {
  ctx.save()
  ctx.strokeStyle = col; ctx.lineWidth = lw || 1
  if (dash) ctx.setLineDash(dash)
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke()
  ctx.restore()
}

/* ---------- S5-M3 文字建筑：大字堆成一座楼 ---------- */
function m3 () {
  rs(7)
  const BG = '#efe9dc', INK = '#232019'
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H)
  // 远景城市淡影
  ctx.fillStyle = 'rgba(28,26,22,.07)'
  for (let i = 0; i < 10; i++) {
    const bh = 14 + ((i * 53) % 40)
    ctx.fillRect(i * 34 - 6, 150 - bh, 26, bh)
  }
  // 地面
  ctx.fillStyle = '#1e1c18'; ctx.fillRect(0, 150, W, 30)
  ctx.fillStyle = 'rgba(239,233,220,.10)'; ctx.fillRect(0, 150, W, 1)

  const cx = 148
  const rows = [
    { t: '光', w: 60, h: 28, y: 22, fs: 19 },
    { t: '信念', w: 104, h: 32, y: 50, fs: 24 },
    { t: '坚持', w: 152, h: 34, y: 82, fs: 27 },
    { t: '时代答案', w: 212, h: 34, y: 116, fs: 25 },
  ]
  rows.forEach((r, i) => {
    ctx.fillStyle = INK
    ctx.fillRect(cx - r.w / 2, r.y, r.w, r.h)
    // 楼层挑檐
    ctx.fillStyle = 'rgba(239,233,220,.30)'
    ctx.fillRect(cx - r.w / 2, r.y, r.w, 1)
    // 字
    ctx.fillStyle = BG
    ctx.font = '700 ' + r.fs + 'px ' + F.sans
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
    ctx.fillText(r.t, cx, r.y + r.h / 2 + 1)
    // 底部接缝
    ctx.fillStyle = 'rgba(0,0,0,.55)'
    ctx.fillRect(cx - r.w / 2, r.y + r.h - 1, r.w, 1)
  })
  // 顶上的红旗杆
  line(cx, 22, cx, 7, INK, 1.6)
  ctx.fillStyle = '#b03a2e'
  ctx.beginPath(); ctx.moveTo(cx, 8); ctx.lineTo(cx + 17, 12); ctx.lineTo(cx, 16); ctx.closePath(); ctx.fill()
  // 右侧尺寸标注
  ctx.strokeStyle = 'rgba(35,32,25,.45)'; ctx.lineWidth = 1
  ctx.beginPath()
  ctx.moveTo(292, 22); ctx.lineTo(292, 150)
  ctx.moveTo(288, 22); ctx.lineTo(296, 22)
  ctx.moveTo(288, 150); ctx.lineTo(296, 150)
  ctx.stroke()
  ctx.save(); ctx.translate(300, 88); ctx.rotate(-Math.PI / 2)
  txt('128 m', 0, 0, '8px ' + F.mono, 'rgba(35,32,25,.65)', 'center')
  ctx.restore()
  // 左侧红竖条
  ctx.fillStyle = '#b03a2e'
  ctx.fillRect(cx - 106, 118, 3, 30)
  txt('01 / 文字建筑', 12, 14, '9px ' + F.mono, 'rgba(35,32,25,.55)')
  txt('WORDS  AS  BUILDING', 12, 170, '8px ' + F.mono, 'rgba(239,233,220,.35)')
}

/* ---------- S5-M4 一个元素串全片：同一方块跑遍全屏 ---------- */
function m4 () {
  rs(13)
  const g = ctx.createLinearGradient(0, 0, W, H)
  g.addColorStop(0, '#101318'); g.addColorStop(1, '#1d2530')
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H)

  ctx.save(); ctx.setLineDash([3, 6])
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1
  ctx.beginPath(); ctx.moveTo(28, 152)
  ctx.bezierCurveTo(110, 150, 150, 60, 292, 38); ctx.stroke()
  ctx.restore()

  const pts = [[28, 152, 9, 0], [86, 140, 15, 18], [146, 112, 21, 38], [208, 80, 27, 56], [288, 38, 33, 74]]
  for (let i = 0; i < pts.length; i++) {
    const [x, y, s, rot] = pts[i]
    const last = i === pts.length - 1
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot * Math.PI / 180)
    if (!last) {
      ctx.strokeStyle = 'rgba(255,138,80,' + (0.35 + i * 0.14) + ')'
      ctx.lineWidth = 1.6
      rr(-s / 2, -s / 2, s, s, s * 0.24); ctx.stroke()
      ctx.fillStyle = 'rgba(255,138,80,.14)'; ctx.fill()
    } else {
      // 速度残影
      ctx.strokeStyle = 'rgba(255,138,80,.28)'; ctx.lineWidth = 2
      for (let k = 1; k <= 3; k++) {
        rr(-s / 2 - k * 9, -s / 2 - k * 9, s, s, s * 0.24); ctx.stroke()
      }
      ctx.fillStyle = '#ff7a35'
      rr(-s / 2, -s / 2, s, s, s * 0.24); ctx.fill()
      ctx.fillStyle = '#141a21'
      ctx.beginPath(); ctx.arc(0, 0, s * 0.19, 0, 6.2832); ctx.fill()
    }
    ctx.restore()
    txt(String(i + 1).padStart(2, '0'), x, y + s / 2 + 12, '7px ' + F.mono, 'rgba(255,255,255,.30)', 'center')
  }
  txt('03 / 一个元素串全片', 12, 16, '9px ' + F.mono, 'rgba(180,195,212,.75)')
  txt('SAME  ELEMENT   ×   5', 12, 30, '8px ' + F.mono, 'rgba(255,138,80,.7)')
  txt('同一个图形，从开场走到结尾', 16, 172, '10px ' + F.sans, 'rgba(190,202,216,.7)')
}

/* ---------- S5-M5 一镜到底：一点透视长走廊 ---------- */
function m5 () {
  const g = ctx.createLinearGradient(0, 0, 0, 150)
  g.addColorStop(0, '#a9bfd1'); g.addColorStop(.55, '#d5e2ea'); g.addColorStop(1, '#eef4f7')
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 150)
  ctx.fillStyle = '#8ea3b2'; ctx.fillRect(0, 150, W, 30)
  const vx = 160, vy = 88

  ctx.strokeStyle = 'rgba(46,68,84,.28)'; ctx.lineWidth = 1
  for (let i = -7; i <= 7; i++) {
    ctx.beginPath(); ctx.moveTo(vx + i * 58, 180); ctx.lineTo(vx, vy); ctx.stroke()
  }
  ctx.strokeStyle = 'rgba(46,68,84,.15)'
  for (let i = -7; i <= 7; i++) {
    ctx.beginPath(); ctx.moveTo(vx + i * 58, -8); ctx.lineTo(vx, vy); ctx.stroke()
  }
  // 渐远的门框
  const fr = [[152, 88], [112, 66], [80, 48], [56, 34], [36, 22]]
  // 侧墙板块（相邻门框之间的透视带）
  for (let i = 0; i < fr.length - 1; i++) {
    const [hw, hh] = fr[i], [nh, nv] = fr[i + 1]
    const y0 = vy - hh * 0.92, y1 = vy + hh * 0.82
    const ny0 = vy - nv * 0.92, ny1 = vy + nv * 0.82
    ctx.fillStyle = i % 2 ? 'rgba(255,255,255,.16)' : 'rgba(70,96,116,.10)'
    ctx.beginPath()
    ctx.moveTo(vx - hw, y0); ctx.lineTo(vx - nh, ny0)
    ctx.lineTo(vx - nh, ny1); ctx.lineTo(vx - hw, y1)
    ctx.closePath(); ctx.fill()
    ctx.beginPath()
    ctx.moveTo(vx + hw, y0); ctx.lineTo(vx + nh, ny0)
    ctx.lineTo(vx + nh, ny1); ctx.lineTo(vx + hw, y1)
    ctx.closePath(); ctx.fill()
  }
  fr.forEach(([hw, hh], i) => {
    const y0 = vy - hh * 0.92, y1 = vy + hh * 0.82
    ctx.strokeStyle = 'rgba(38,58,74,' + (0.62 - i * 0.09) + ')'
    ctx.lineWidth = i === 0 ? 2.2 : 1.2
    ctx.strokeRect(vx - hw, y0, hw * 2, y1 - y0)
  })
  // 尽头的光
  const eg = ctx.createRadialGradient(vx, vy, 2, vx, vy, 46)
  eg.addColorStop(0, 'rgba(255,252,240,.95)'); eg.addColorStop(.5, 'rgba(255,248,225,.35)'); eg.addColorStop(1, 'rgba(255,248,225,0)')
  ctx.fillStyle = eg; ctx.fillRect(vx - 50, vy - 50, 100, 100)
  // 走着的人
  ctx.fillStyle = '#2c3b46'
  ctx.beginPath(); ctx.arc(160, 134, 4.2, 0, 6.2832); ctx.fill()
  rr(156.4, 139, 7.2, 13, 3); ctx.fill()
  line(158, 152, 156, 160, '#2c3b46', 2.4)
  line(162, 152, 164, 160, '#2c3b46', 2.4)
  // 顶灯
  ctx.fillStyle = 'rgba(255,250,232,.85)'
  for (const [lx, ly, lw2] of [[124, 34, 9], [196, 34, 9], [146, 12, 5], [174, 12, 5]]) {
    ctx.fillRect(lx - lw2 / 2, ly, lw2, 2)
  }
  // 标注
  txt('05 / 一镜到底', 12, 16, '9px ' + F.mono, 'rgba(30,48,62,.7)')
  txt('ONE  TAKE  ·  NO  CUT', 12, 30, '8px ' + F.mono, 'rgba(30,48,62,.45)')
  const t = '00:00:07'
  txt(t, 306, 16, '9px ' + F.mono, 'rgba(30,48,62,.6)', 'right')
  dot(300, 26, 2.6, '#c0392b')
  txt('REC', 306, 29, '7px ' + F.mono, 'rgba(30,48,62,.55)', 'right')
  // 画框暗角
  const vg = ctx.createRadialGradient(160, 96, 70, 160, 96, 210)
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(20,35,48,.28)')
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H)
}

/* ---------- S5-M6 苹果发布会风：深色舞台 + 一束光 ---------- */
function m6 () {
  const g = ctx.createRadialGradient(160, 150, 10, 160, 150, 230)
  g.addColorStop(0, '#2b2e34'); g.addColorStop(.45, '#131417'); g.addColorStop(1, '#050506')
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H)
  const gl = ctx.createRadialGradient(160, 178, 4, 160, 178, 130)
  gl.addColorStop(0, 'rgba(125,175,225,.50)'); gl.addColorStop(.45, 'rgba(70,110,160,.16)'); gl.addColorStop(1, 'rgba(0,0,0,0)')
  ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H)

  txt('OCTOBER · KEYNOTE', 160, 15, '8px ' + F.mono, 'rgba(200,205,214,.55)', 'center')
  txt('再一次', 160, 58, '300 36px ' + F.sans, '#f5f5f7', 'center')
  ctx.fillStyle = '#f5f5f7'
  txt('改变世界。', 160, 80, '300 17px ' + F.sans, 'rgba(245,245,247,.72)', 'center')

  // 产品：从光里升起
  const px = 160, pw = 62, ph = 96, py = 186
  const pg = ctx.createLinearGradient(px - pw / 2, 0, px + pw / 2, 0)
  pg.addColorStop(0, '#070709'); pg.addColorStop(.16, '#3a4049')
  pg.addColorStop(.30, '#0b0c0e'); pg.addColorStop(.75, '#111216'); pg.addColorStop(1, '#050506')
  rr(px - pw / 2, py - ph, pw, ph, 13); ctx.fillStyle = pg; ctx.fill()
  ctx.strokeStyle = 'rgba(185,212,240,.50)'; ctx.lineWidth = 1; ctx.stroke()
  // 边缘光竖线
  ctx.strokeStyle = 'rgba(210,232,255,.75)'; ctx.lineWidth = 1.4
  ctx.beginPath(); ctx.moveTo(px - pw / 2 + 7, py - ph + 14); ctx.lineTo(px - pw / 2 + 7, py - 22); ctx.stroke()
  // 跟随光斑
  ctx.fillStyle = 'rgba(255,255,255,.10)'
  ctx.beginPath(); ctx.ellipse(px + 8, py - ph + 6, 20, 3, 0, 0, 6.2832); ctx.fill()
  // 地面光斑
  const fl = ctx.createRadialGradient(px, 178, 2, px, 178, 90)
  fl.addColorStop(0, 'rgba(190,215,245,.30)'); fl.addColorStop(1, 'rgba(190,215,245,0)')
  ctx.fillStyle = fl
  ctx.beginPath(); ctx.ellipse(px, 177, 96, 9, 0, 0, 6.2832); ctx.fill()

  txt('10:00  ·  Cupertino', 12, 172, '7px ' + F.mono, 'rgba(180,186,196,.35)')
}

/* ---------- S5-M7 极简卡点：纯色块 + 节拍刻度 ---------- */
function m7 () {
  ctx.fillStyle = '#f2f0e9'; ctx.fillRect(0, 0, W, H)
  // 红大块
  ctx.fillStyle = '#e03a2f'; ctx.fillRect(0, 100, 118, 80)
  // 芥末方块
  ctx.fillStyle = '#f2b705'; ctx.fillRect(212, 12, 78, 78)
  // 黑细条
  ctx.fillStyle = '#141414'; ctx.fillRect(138, 96, 66, 10)
  // 蓝小块
  ctx.fillStyle = '#2f5bea'; ctx.fillRect(212, 108, 44, 44)
  // 空心方框
  ctx.strokeStyle = '#141414'; ctx.lineWidth = 1.2
  ctx.strokeRect(38, 30, 52, 52)
  ctx.fillStyle = '#141414'
  ctx.beginPath(); ctx.moveTo(64, 44); ctx.lineTo(80, 56); ctx.lineTo(64, 68); ctx.closePath(); ctx.fill()
  // 节拍刻度
  const bx = 30, by = 168
  for (let i = 0; i < 12; i++) {
    const on = i % 4 === 0
    ctx.fillStyle = on ? '#141414' : 'rgba(20,20,20,.35)'
    ctx.fillRect(bx + i * 21, by - (on ? 10 : 5), 2, on ? 10 : 5)
  }
  ctx.fillStyle = '#e03a2f'
  ctx.fillRect(bx + 4 * 21 - 2, by - 13, 6, 13)
  txt('BPM 128 · 4/4', 306, 172, '8px ' + F.mono, 'rgba(20,20,20,.55)', 'right')
  txt('07 / 极简卡点', 12, 18, '9px ' + F.mono, 'rgba(20,20,20,.55)')
}

/* ---------- S5-M8 口播 + 逐字字幕 ---------- */
function m8 () {
  const g = ctx.createLinearGradient(0, 0, 0, H)
  g.addColorStop(0, '#1c2632'); g.addColorStop(1, '#0c1117')
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H)
  const kl = ctx.createRadialGradient(222, 54, 8, 222, 54, 150)
  kl.addColorStop(0, 'rgba(96,138,180,.38)'); kl.addColorStop(1, 'rgba(0,0,0,0)')
  ctx.fillStyle = kl; ctx.fillRect(0, 0, W, H)

  // 人像剪影
  ctx.fillStyle = '#2b3746'
  ctx.beginPath(); ctx.ellipse(238, 64, 25, 29, 0, 0, 6.2832); ctx.fill()
  ctx.beginPath(); ctx.moveTo(192, 180)
  ctx.quadraticCurveTo(198, 106, 238, 100)
  ctx.quadraticCurveTo(280, 106, 286, 180)
  ctx.closePath(); ctx.fill()
  // 头发 + 轮廓光
  ctx.fillStyle = '#202a36'
  ctx.beginPath(); ctx.ellipse(238, 52, 26, 19, 0, Math.PI, 6.2832); ctx.fill()
  ctx.strokeStyle = 'rgba(150,192,232,.55)'; ctx.lineWidth = 1.6
  ctx.beginPath(); ctx.arc(238, 64, 25, Math.PI * .78, Math.PI * 1.34); ctx.stroke()

  // 字幕带
  ctx.fillStyle = 'rgba(4,7,10,.55)'; ctx.fillRect(0, 140, W, 40)
  ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.fillRect(0, 140, W, 1)
  const segs = [['这就是 ', '#ffffff', null], ['关键', '#131313', '#ffd60a'], ['所在', 'rgba(255,255,255,.38)', null]]
  ctx.font = '700 19px ' + F.sans
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left'
  let x = 16
  for (const [t, col, bg] of segs) {
    const w = ctx.measureText(t).width
    if (bg) { ctx.fillStyle = bg; ctx.fillRect(x - 2, 146, w + 4, 23) }
    ctx.fillStyle = col; ctx.fillText(t, x, 165)
    x += w
  }
  // 录制标记
  dot(276, 18, 3.4, '#e5484d')
  txt('REC 00:12', 306, 21, '8px ' + F.mono, 'rgba(255,255,255,.55)', 'right')
  txt('08 / 口播 + 逐字字幕', 12, 22, '9px ' + F.mono, 'rgba(200,215,230,.65)')
  // 左侧柔光柱
  const beam = ctx.createLinearGradient(0, 0, 90, 0)
  beam.addColorStop(0, 'rgba(120,165,205,.16)'); beam.addColorStop(1, 'rgba(120,165,205,0)')
  ctx.fillStyle = beam
  ctx.beginPath(); ctx.moveTo(28, 0); ctx.lineTo(96, 0); ctx.lineTo(60, 180); ctx.lineTo(0, 180); ctx.closePath(); ctx.fill()
}

/* ---------- S5-M9 情绪弧线：混乱 → 掌控 → 清晰 ---------- */
function m9 () {
  rs(3)
  ctx.fillStyle = '#2a1b21'; ctx.fillRect(0, 0, 106, H)
  ctx.fillStyle = '#a8532f'; ctx.fillRect(106, 0, 107, H)
  ctx.fillStyle = '#dbeaf2'; ctx.fillRect(213, 0, 107, H)

  // 段一：涂鸦
  for (let i = 0; i < 40; i++) {
    const x = 6 + rnd() * 94, y = 16 + rnd() * 146
    ctx.strokeStyle = 'rgba(214,96,80,' + (0.25 + rnd() * 0.55) + ')'
    ctx.lineWidth = 0.7 + rnd() * 1.3
    ctx.beginPath(); ctx.moveTo(x, y)
    ctx.lineTo(x + rn(-15, 15), y + rn(-11, 11))
    ctx.lineTo(x + rn(-17, 17), y + rn(-13, 13))
    ctx.stroke()
  }
  // 段二：网格 + 对齐的三条
  ctx.strokeStyle = 'rgba(255,232,208,.16)'; ctx.lineWidth = 1
  for (let y = 16; y < H; y += 18) line(106, y, 213, y, 'rgba(255,232,208,.16)')
  for (let x = 124; x < 213; x += 18) line(x, 0, x, H, 'rgba(255,232,208,.10)')
  ctx.fillStyle = 'rgba(255,240,222,.9)'
  for (let i = 0; i < 3; i++) ctx.fillRect(128, 62 + i * 22, 54, 6)
  ctx.fillStyle = 'rgba(255,240,222,.35)'
  ctx.fillRect(128, 128, 26, 4)
  // 段三：单圆
  ctx.strokeStyle = '#2b6f8f'; ctx.lineWidth = 2
  ctx.beginPath(); ctx.arc(266, 78, 26, 0, 6.2832); ctx.stroke()
  dot(266, 78, 4, '#2b6f8f')
  line(232, 122, 300, 122, 'rgba(43,111,143,.45)', 1)

  // 情绪弧
  ctx.strokeStyle = '#f7e7cf'; ctx.lineWidth = 3; ctx.lineCap = 'round'
  ctx.beginPath(); ctx.moveTo(8, 158)
  ctx.quadraticCurveTo(120, 18, 170, 26)
  ctx.quadraticCurveTo(240, 36, 312, 96)
  ctx.stroke()
  // 箭头
  ctx.fillStyle = '#f7e7cf'
  ctx.beginPath(); ctx.moveTo(313, 97); ctx.lineTo(300, 86); ctx.lineTo(303, 101); ctx.closePath(); ctx.fill()
  // 起始点
  dot(8, 158, 4.5, '#f7e7cf')

  txt('混乱', 30, 172, '700 12px ' + F.hand, 'rgba(232,176,160,.9)')
  txt('掌控', 132, 172, '700 12px ' + F.hand, 'rgba(255,224,196,.95)')
  txt('清晰', 246, 172, '700 12px ' + F.hand, 'rgba(28,74,96,.9)')
  txt('09 / 情绪弧线', 8, 14, '8px ' + F.mono, 'rgba(255,255,255,.42)')
}

/* ---------- S5-M10 抽象概念成画面：熵 ---------- */
function m10 () {
  ctx.fillStyle = '#fbfaff'; ctx.fillRect(0, 0, W, H)
  ctx.fillStyle = 'rgba(120,110,160,.20)'
  for (let y = 14; y < 174; y += 18) {
    for (let x = 12; x < 148; x += 18) ctx.fillRect(x, y, 1.4, 1.4)
  }
  // 轨道
  ctx.save(); ctx.translate(212, 84)
  ctx.strokeStyle = 'rgba(109,91,208,.32)'; ctx.lineWidth = 1
  ctx.beginPath(); ctx.ellipse(0, 0, 70, 27, -0.42, 0, 6.2832); ctx.stroke()
  // 球
  const rg = ctx.createRadialGradient(-16, -18, 4, 0, 0, 46)
  rg.addColorStop(0, '#c8bcff'); rg.addColorStop(.55, '#8a72e8'); rg.addColorStop(1, '#3d2d8a')
  ctx.beginPath(); ctx.arc(0, 0, 44, 0, 6.2832); ctx.fillStyle = rg; ctx.fill()
  // 经纬网
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, 44, 0, 6.2832); ctx.clip()
  ctx.strokeStyle = 'rgba(255,255,255,.30)'; ctx.lineWidth = 0.9
  for (let k = -3; k <= 3; k++) {
    const yy = k * 11
    const rx = Math.sqrt(Math.max(0, 44 * 44 - yy * yy))
    if (rx < 2) continue
    ctx.beginPath(); ctx.ellipse(0, yy, rx, rx * 0.26, 0, 0, 6.2832); ctx.stroke()
  }
  for (let k = -3; k <= 3; k++) {
    const rx = 44 - Math.abs(k) * 11.5
    if (rx < 2) continue

      ctx.beginPath(); ctx.moveTo(x - 4, y + 6); ctx.lineTo(x + 4, y + 6)
      ctx.moveTo(x - 3, y + 9); ctx.lineTo(x + 3, y + 9); ctx.stroke()
      ctx.beginPath(); ctx.moveTo(x, y - 8); ctx.lineTo(x, y - 12)
      ctx.moveTo(x - 9, y - 3); ctx.lineTo(x - 12, y - 3)
      ctx.moveTo(x + 9, y - 3); ctx.lineTo(x + 12, y - 3); ctx.stroke()
    } else if (kind === 1) { // 齿轮
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4
        ctx.beginPath()
        ctx.moveTo(x + Math.cos(a) * 6.5, y + Math.sin(a) * 6.5)

      ctx.beginPath(); ctx.arc(x, y, 6.5, 0, 6.2832); ctx.stroke()
      ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 6.2832); ctx.stroke()
    } else { // 对勾
      ctx.beginPath(); ctx.moveTo(x - 8, y); ctx.lineTo(x - 2, y + 6); ctx.lineTo(x + 9, y - 7); ctx.stroke()
    }
  }

/* ---------- S5-M21 原理拆解：爆炸图 + 引线标注 ---------- */
function m21 () {

    ctx.save(); ctx.translate(x, y)
    const g = ctx.createLinearGradient(-30, -14, 30, 14)

    ctx.strokeStyle = '#26506e'; ctx.lineWidth = 1.2; ctx.stroke()

    ctx.beginPath(); ctx.ellipse(-6, -4, 14, 5, -0.2, Math.PI * 1.15, Math.PI * 1.75); ctx.stroke()
    ctx.restore()

    ctx.beginPath(); ctx.arc(0, 0, 25, 0, 6.2832); ctx.fillStyle = '#2b3d52'; ctx.fill()

    ctx.strokeStyle = '#22384d'; ctx.lineWidth = 1.6

    ctx.restore()
  }

    ctx.fillStyle = '#2b5a4e'
