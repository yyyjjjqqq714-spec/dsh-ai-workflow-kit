<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#111;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="320" height="180"></canvas>
<script>
const W = 320, H = 180
const c = document.getElementById('c')
const ctx = c.getContext('2d')
const id = new URLSearchParams(location.search).get('id') || 'S5-M22'

const F = {
  sans: '"Microsoft YaHei",sans-serif',
  serif: '"SimSun",serif',
  kai: '"KaiTi",serif',
  mono: '"Consolas",monospace',
}

function bg(col) { ctx.fillStyle = col; ctx.fillRect(0, 0, W, H) }
function rr(x, y, w, h, r) {
  const rad = Math.min(r, w / 2, h / 2)
  ctx.beginPath()
  ctx.moveTo(x + rad, y)
  ctx.arcTo(x + w, y, x + w, y + h, rad)
  ctx.arcTo(x + w, y + h, x, y + h, rad)
  ctx.arcTo(x, y + h, x, y, rad)
  ctx.arcTo(x, y, x + w, y, rad)
  ctx.closePath()
}
function T(s, x, y, size, color, font, align, weight) {
  ctx.save()
  ctx.fillStyle = color
  ctx.font = (weight ? weight + ' ' : '') + size + 'px ' + (font || F.sans)
  ctx.textAlign = align || 'left'
  ctx.textBaseline = 'alphabetic'
  ctx.fillText(s, x, y)
  ctx.restore()
}
function L(x1, y1, x2, y2, color, w, dash) {
  ctx.save()
  ctx.strokeStyle = color
  ctx.lineWidth = w || 1
  if (dash) ctx.setLineDash(dash)
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke()
  ctx.restore()
}
function rng(seed) {
  let a = seed >>> 0
  return function () {
    a = a + 0x6D2B79F5 | 0
    let t = Math.imul(a ^ a >>> 15, 1 | a)
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t
    return ((t ^ t >>> 14) >>> 0) / 4294967296
  }
}

/* ============================================================
   S5-M22 配方式步骤 —— 编号步骤 + 分层酒杯 + 分量刻度
   ============================================================ */
function M22() {
  bg('#f7f2e6')
  ctx.fillStyle = '#efe6d1'; ctx.fillRect(0, 0, W, 54)
  T('RECIPE · 03  /  MIXED', 14, 16, 6, '#c0503f', F.mono, 'left', '700')
  T('青柠气泡', 14, 44, 22, '#1d2b28', F.sans, 'left', '700')
  T('3 STEPS · 90 SEC · EASY', 14, 64, 5.5, '#8a8676', F.mono, 'left', '700')
  L(14, 72, 150, 72, '#ddd3bd', 1)

  L(24, 86, 24, 142, '#cfc4ab', 1, [3, 3])
  const steps = [
    ['金酒', '45 ml', '#2f7f74', 'GIN'],
    ['青柠汁', '20 ml', '#9cbb4a', 'LIME'],
    ['苏打水', '90 ml', '#cdd6c2', 'SODA'],
  ]
  steps.forEach((s, i) => {
    const y = 92 + i * 26
    ctx.beginPath(); ctx.arc(24, y - 3, 9, 0, 7); ctx.fillStyle = s[2]; ctx.fill()
    ctx.strokeStyle = '#f7f2e6'; ctx.lineWidth = 2; ctx.stroke()
    T(String(i + 1), 24, y, 9, i === 2 ? '#3d4237' : '#fff', F.mono, 'center', '700')
    T(s[0], 40, y + 1, 10.5, '#23302d', F.sans, 'left', '700')
    T(s[3], 40, y + 11, 4.8, '#a09a88', F.mono, 'left', '700')
    T(s[1], 186, y + 1, 7, '#5d5a4e', F.mono, 'right', '700')
    L(40, y + 5, 186, y + 5, 'rgba(120,110,88,.18)', 0.6, [2, 3])
  })

  const gx = 242, gt = 64, gb = 150, gw = 54
  const glass = () => {
    ctx.beginPath()
    ctx.moveTo(gx - gw / 2, gt)
    ctx.lineTo(gx - gw / 2 + 7, gb - 6)
    ctx.quadraticCurveTo(gx, gb + 4, gx + gw / 2 - 7, gb - 6)
    ctx.lineTo(gx + gw / 2, gt)
  }
  ctx.save(); glass(); ctx.clip()
  ctx.fillStyle = '#eef0d8'; ctx.fillRect(gx - 40, 96, 80, 60)
  ctx.fillStyle = '#b9cf6a'; ctx.fillRect(gx - 40, 116, 80, 46)
  ctx.fillStyle = '#2f7f74'; ctx.fillRect(gx - 40, 134, 80, 30)
  const rb = rng(7)
  for (let i = 0; i < 28; i++) {
    const x = gx - gw / 2 + 6 + rb() * (gw - 12)
    const y = 100 + rb() * 42
    ctx.beginPath(); ctx.arc(x, y, 0.7 + rb() * 1.7, 0, 7)
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fill()
  }
  ctx.fillStyle = 'rgba(255,255,255,.28)'
  ctx.fillRect(gx - gw / 2 + 4, gt + 5, 5, gb - gt - 18)
  ctx.restore()
  glass(); ctx.strokeStyle = '#c9d2c2'; ctx.lineWidth = 2; ctx.stroke()
  ctx.beginPath(); ctx.ellipse(gx, gt, gw / 2, 4, 0, 0, 7)
  ctx.strokeStyle = '#dfe6d8'; ctx.lineWidth = 2; ctx.stroke()

  // 青柠片
  ctx.beginPath(); ctx.arc(gx + gw / 2 - 1, gt + 1, 9, 0, 7)
  ctx.fillStyle = '#8fae3e'; ctx.fill()
  ctx.strokeStyle = '#e9f0cf'; ctx.lineWidth = 1.4
  for (let k = 0; k < 4; k++) {
    const a = -Math.PI / 2 + k * Math.PI / 2
    ctx.beginPath(); ctx.moveTo(gx + gw / 2 - 1, gt + 1)
    ctx.lineTo(gx + gw / 2 - 1 + Math.cos(a) * 8, gt + 1 + Math.sin(a) * 8)
    ctx.stroke()
  }
  const marks = [[96, '90'], [116, '60'], [134, '30']]
  marks.forEach(([y, lab]) => {
    L(gx - gw / 2 - 9, y, gx - gw / 2 - 2, y, '#b9b19c', 1)
    T(lab, gx - gw / 2 - 11, y + 2, 4.5, '#a8a08c', F.mono, 'right')
  })
  L(14, 166, 306, 166, '#ded4bd', 1, [3, 3])
  T('SHAKE · POUR · SERVE', 14, 176, 5.5, '#8a8676', F.mono, 'left', '700')
  T('SERVE 01', W - 14, 176, 5.5, '#c0503f', F.mono, 'right', '700')
}

/* ============================================================
   S5-M23 五幕讲解 —— 五段式胶片分镜条
   ============================================================ */
function M23() {
  bg('#17130f')
  const g = ctx.createRadialGradient(160, 86, 8, 160, 86, 190)
  g.addColorStop(0, 'rgba(96,58,26,.6)'); g.addColorStop(1, 'rgba(23,19,15,0)')
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H)
  ctx.fillStyle = '#0b0907'
  for (let x = 10; x < W; x += 22) { rr(x, 7, 10, 6, 2); ctx.fill(); rr(x, 167, 10, 6, 2); ctx.fill() }
  T('FIVE ACTS', 4, 21, 5, 'rgba(185,138,74,.75)', F.mono, 'left', '700')

  const acts = [['01', '起'], ['02', '承'], ['03', '转'], ['04', '合'], ['05', '尾']]
  for (let i = 0; i < 5; i++) {
    const x = 4 + i * 64, y = 24, w = 56, h = 130
    ctx.fillStyle = i === 2 ? '#31241a' : '#221b14'
    rr(x, y, w, h, 3); ctx.fill()
    ctx.strokeStyle = i === 2 ? '#c2914c' : '#3a2e22'; ctx.lineWidth = 1; ctx.stroke()
    T(acts[i][0], x + 6, y + 14, 5.5, '#b98a4a', F.mono, 'left', '700')
    const cx = x + w / 2, cy = 84

    if (i === 0) { // 种子入土
      L(x + 8, 106, x + w - 8, 106, '#6b5a44', 1)
      ctx.fillStyle = '#5a4a36'
      for (let k = 0; k < 6; k++) ctx.fillRect(x + 12 + k * 6, 108 + (k % 2) * 3, 2, 1.5)
      ctx.beginPath(); ctx.ellipse(cx, 99, 5.5, 4.2, -0.2, 0, 7)
      ctx.fillStyle = '#d9b47a'; ctx.fill()
      ctx.strokeStyle = '#8d6b45'; ctx.lineWidth = 1
      ctx.beginPath(); ctx.moveTo(cx - 1, 103); ctx.quadraticCurveTo(cx - 5, 110, cx - 9, 112); ctx.stroke()
    } else if (i === 1) { // 发芽
      L(cx, 112, cx, 84, '#8fbf7a', 2)
      ctx.fillStyle = '#8fbf7a'
      ctx.beginPath(); ctx.ellipse(cx - 9, 88, 9, 3.4, -0.5, 0, 7); ctx.fill()
      ctx.beginPath(); ctx.ellipse(cx + 9, 95, 9, 3.4, 0.5, 0, 7); ctx.fill()
      L(x + 10, 114, x + w - 10, 114, '#6b5a44', 1)
    } else if (i === 2) { // 转：风雨
      for (let k = 0; k < 7; k++) L(x + 10 + k * 6, 48, x + 6 + k * 6, 62, 'rgba(160,190,210,.45)', 1)
      ctx.beginPath(); ctx.moveTo(cx + 10, 46); ctx.lineTo(cx + 1, 66)
      ctx.lineTo(cx + 7, 66); ctx.lineTo(cx - 2, 86)
      ctx.strokeStyle = '#f0c05a'; ctx.lineWidth = 2.4; ctx.stroke()
      L(cx, 112, cx, 96, '#7fae6b', 2)
      ctx.fillStyle = '#7fae6b'
      ctx.beginPath(); ctx.ellipse(cx - 7, 100, 7, 3, -0.5, 0, 7); ctx.fill()
      ctx.beginPath(); ctx.ellipse(cx + 7, 106, 7, 3, 0.5, 0, 7); ctx.fill()
    } else if (i === 3) { // 合：开花
      L(cx, 118, cx, 98, '#7fae6b', 2)
      for (let k = 0; k < 6; k++) {
        const a = k * Math.PI / 3
        ctx.save(); ctx.translate(cx + Math.cos(a) * 9, 88 + Math.sin(a) * 9); ctx.rotate(a)
        ctx.beginPath(); ctx.ellipse(0, 0, 6.5, 3.6, 0, 0, 7)
        ctx.fillStyle = '#d97f8e'; ctx.fill(); ctx.restore()
      }
      ctx.beginPath(); ctx.arc(cx, 88, 4.6, 0, 7); ctx.fillStyle = '#f0c05a'; ctx.fill()
      ctx.fillStyle = '#7fae6b'
      ctx.beginPath(); ctx.ellipse(cx - 8, 104, 7, 3, -0.5, 0, 7); ctx.fill()
    } else { // 尾：结果
      L(cx, 112, cx, 92, '#7fae6b', 2)
      ctx.beginPath(); ctx.arc(cx, 84, 10, 0, 7); ctx.fillStyle = '#c9563f'; ctx.fill()
      ctx.beginPath(); ctx.ellipse(cx + 7, 74, 5, 2.4, -0.6, 0, 7); ctx.fillStyle = '#7fae6b'; ctx.fill()
      ctx.fillStyle = 'rgba(255,235,210,.5)'
      ctx.beginPath(); ctx.arc(cx - 3.5, 80, 2.4, 0, 7); ctx.fill()
      for (let k = 0; k < 3; k++) {
        ctx.beginPath(); ctx.arc(x + 14 + k * 14, 122, 1.6, 0, 7)
        ctx.fillStyle = 'rgba(185,138,74,.55)'; ctx.fill()
      }
    }
    T(acts[i][1], cx, y + h - 7, 11, '#e8dcc6', F.kai, 'center', '700')
    L(x + 10, y + h - 16, x + w - 10, y + h - 16, 'rgba(185,138,74,.25)', 0.7)
  }
}

/* ============================================================
   S5-M24 四段式发布片 —— 四屏并置 + 节奏条
   ============================================================ */
function M24() {
  bg('#eef1f5')
  T('四段式发布片', 16, 27, 14, '#111820', F.sans, 'left', '700')
  T('PRODUCT LAUNCH · 4 BEATS', 16, 39, 5, '#7c8794', F.mono, 'left', '700')
  L(16, 47, 304, 47, '#d6dce4', 1)

  const labels = ['大环境', '痛点', '解决办法', '好处']
  const subs = ['MARKET', 'PAIN', 'SOLUTION', 'GAIN']
  const xs = [16, 92, 168, 244]
  for (let i = 0; i < 4; i++) {
    const x = xs[i], w = 66, y = 56, h = 88
    ctx.save(); ctx.shadowColor = 'rgba(20,30,50,.10)'; ctx.shadowBlur = 7; ctx.shadowOffsetY = 2
    ctx.fillStyle = '#fff'; rr(x, y, w, h, 5); ctx.fill(); ctx.restore()
    ctx.strokeStyle = '#dde2e9'; ctx.lineWidth = 1; rr(x, y, w, h, 5); ctx.stroke()

    ctx.beginPath(); ctx.arc(x + 13, y + 13, 7, 0, 7); ctx.fillStyle = '#2c4a6b'; ctx.fill()
    T('0' + (i + 1), x + 13, y + 15.5, 5, '#fff', F.mono, 'center', '700')

    if (i === 0) {
      // 全球市场：球体 + 经纬线 + 连线节点
      ctx.beginPath(); ctx.arc(x + 33, 92, 18, 0, 7)
      ctx.fillStyle = 'rgba(195,210,226,.35)'; ctx.fill()
      ctx.strokeStyle = '#8fa9c4'; ctx.lineWidth = 1.2; ctx.stroke()
      ctx.beginPath(); ctx.ellipse(x + 33, 92, 7.5, 18, 0, 0, 7); ctx.stroke()
      L(x + 15, 92, x + 51, 92, '#8fa9c4', 1)
      L(x + 18, 84, x + 48, 84, '#8fa9c4', 0.8)
      L(x + 18, 100, x + 48, 100, '#8fa9c4', 0.8)
      const nodes = [[x + 25, 78], [x + 44, 88], [x + 28, 105]]
      ctx.strokeStyle = 'rgba(44,74,107,.45)'; ctx.lineWidth = 1
      ctx.beginPath(); ctx.moveTo(nodes[0][0], nodes[0][1])
      ctx.quadraticCurveTo(x + 40, 74, nodes[1][0], nodes[1][1])
      ctx.quadraticCurveTo(x + 44, 100, nodes[2][0], nodes[2][1]); ctx.stroke()
      nodes.forEach(n => {
        ctx.beginPath(); ctx.arc(n[0], n[1], 2.2, 0, 7); ctx.fillStyle = '#d9534f'; ctx.fill()
      })
      T('MARKET', x + 33, 124, 4.2, 'rgba(44,74,107,.55)', F.mono, 'center', '700')
    } else if (i === 1) {
      ctx.beginPath(); ctx.moveTo(x + 10, 74); ctx.lineTo(x + 21, 88)
      ctx.lineTo(x + 14, 100); ctx.lineTo(x + 30, 114)
      ctx.strokeStyle = '#d9534f'; ctx.lineWidth = 2; ctx.stroke()
      ctx.strokeStyle = 'rgba(217,83,79,.5)'; ctx.lineWidth = 1.6
      for (const [bx, by] of [[x + 34, 84], [x + 40, 104]]) {
        ctx.beginPath(); ctx.moveTo(bx - 4, by - 4); ctx.lineTo(bx + 4, by + 4)
        ctx.moveTo(bx + 4, by - 4); ctx.lineTo(bx - 4, by + 4); ctx.stroke()
      }
    } else if (i === 2) {
      ctx.beginPath(); ctx.arc(x + 31, 88, 12, 0, 7)
      ctx.fillStyle = '#f6d79b'; ctx.fill()
      ctx.strokeStyle = '#e8a33d'; ctx.lineWidth = 1.4; ctx.stroke()
      ctx.fillStyle = '#e8a33d'; ctx.fillRect(x + 26, 100, 10, 7)
      ctx.strokeStyle = '#e8a33d'; ctx.lineWidth = 1.2
      for (let k = 0; k < 5; k++) {
        const a = -Math.PI / 2 + (k - 2) * 0.55
        ctx.beginPath(); ctx.moveTo(x + 31 + Math.cos(a) * 15, 88 + Math.sin(a) * 15)
        ctx.lineTo(x + 31 + Math.cos(a) * 19, 88 + Math.sin(a) * 19); ctx.stroke()
      }
      ctx.beginPath(); ctx.moveTo(x + 28, 90); ctx.quadraticCurveTo(x + 31, 94, x + 34, 90)
      ctx.strokeStyle = '#c98a2e'; ctx.lineWidth = 1; ctx.stroke()
    } else {
      const bs = [[x + 12, 18, '#4caf7d'], [x + 24, 28, '#3d9a6b'], [x + 36, 38, '#2f855a']]
      bs.forEach(b => { ctx.fillStyle = b[2]; ctx.fillRect(b[0], 116 - b[1], 9, b[1]) })
      L(x + 12, 114, x + 48, 74, '#1f6b47', 1.6)
      ctx.beginPath(); ctx.moveTo(x + 48, 74); ctx.lineTo(x + 41, 76)
      ctx.moveTo(x + 48, 74); ctx.lineTo(x + 47, 82)
      ctx.strokeStyle = '#1f6b47'; ctx.lineWidth = 1.6; ctx.stroke()
    }
    T(labels[i], x + w / 2, 135, 8.5, '#1d2733', F.sans, 'center', '700')
    T(subs[i], x + w / 2, 143, 4.5, '#9aa5b1', F.mono, 'center', '700')
    if (i < 3) T('›', x + w + 5, 104, 11, '#b7c0cc', F.sans, 'center', '700')
  }
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = i === 0 ? '#2c4a6b' : '#d7dde6'
    ctx.fillRect(xs[i], 158, 66, 3)
  }
  T('01 ENV  →  02 PAIN  →  03 FIX  →  04 GAIN', 16, 173, 5, '#8b96a3', F.mono, 'left', '700')
}

/* ============================================================
   S5-M25 歌词卡点 —— 巨型歌词 + 节拍块
   ============================================================ */
function M25() {
  bg('#08080a')
  for (let i = 0; i < 16; i++) L(i * 20 + 10, 0, i * 20 + 10, H, 'rgba(255,255,255,.045)', 1)
  T('00:42:18', 12, 18, 7, '#4fd6e0', F.mono, 'left', '700')
  T('BPM 128', W - 14, 18, 7, '#f05a8a', F.mono, 'right', '700')
  for (let i = 0; i < 4; i++) {
    ctx.beginPath(); ctx.arc(W - 16 - (3 - i) * 11, 30, 2.4, 0, 7)
    ctx.fillStyle = i === 1 ? '#f05a8a' : 'rgba(255,255,255,.22)'; ctx.fill()
  }
  T('我 们 一 起', 28, 72, 19, 'rgba(255,255,255,.5)', F.sans, 'left', '700')

  // 高亮字块（对准第 3 个字“天”）
  ctx.save(); ctx.translate(123, 105); ctx.rotate(-0.05)
  ctx.fillStyle = '#f05a8a'; rr(-19, -17, 38, 36, 5); ctx.fill(); ctx.restore()
  const l2 = '唱到天亮'
  for (let i = 0; i < 4; i++) {
    T(l2[i], 28 + i * 40, 120, 30, i === 2 ? '#0a0a0a' : '#ffffff', F.sans, 'left', '700')
  }
  // 卡拉OK 进度
  ctx.fillStyle = 'rgba(255,255,255,.14)'; rr(28, 130, 172, 3, 1.5); ctx.fill()
  ctx.fillStyle = '#4fd6e0'; rr(28, 130, 108, 3, 1.5); ctx.fill()

  // 节拍块
  const pat = [10, 18, 26, 14, 30, 22, 12, 34, 20, 16, 28, 10, 24, 18, 32, 14]
  for (let i = 0; i < 16; i++) {
    const x = 10 + i * 19, h = pat[i]
    ctx.fillStyle = i % 3 === 0 ? '#f05a8a' : (i % 3 === 1 ? '#4fd6e0' : 'rgba(255,255,255,.65)')
    ctx.globalAlpha = i < 9 ? 0.95 : 0.4
    ctx.fillRect(x, 166 - h, 12, h)
    ctx.globalAlpha = 1
  }
  const rw = rng(25)
  ctx.beginPath()
  for (let i = 0; i <= 40; i++) {
    const x = 10 + i * 7.5
    const y = 172 - (i % 2 === 0 ? 3 + rw() * 5 : 1 + rw() * 2)
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y)
  }
  ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1; ctx.stroke()
  T('♪', 250, 68, 20, '#f05a8a'); T('♫', 282, 52, 14, 'rgba(79,214,224,.8)')
  T('LYRIC SYNC · 16 BEATS', 12, 177, 4.5, 'rgba(255,255,255,.3)', F.mono, 'left', '700')
}

/* ============================================================
   S5-M26 占位-品牌色块
   ============================================================ */
function M26() {
  bg('#f2efe9')
  ctx.strokeStyle = '#c9c2b3'; ctx.lineWidth = 1
  const marks = [[10, 10, 1, 1], [W - 10, 10, -1, 1], [10, H - 10, 1, -1], [W - 10, H - 10, -1, -1]]
  marks.forEach(([x, y, sx, sy]) => {
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + sx * 10, y)
    ctx.moveTo(x, y); ctx.lineTo(x, y + sy * 10); ctx.stroke()
  })
  T('BRAND KIT  /  占位', 18, 22, 5.5, '#8d8678', F.mono, 'left', '700')

  ctx.save(); ctx.translate(104, 92); ctx.rotate(-0.16)
  ctx.fillStyle = '#e0325e'; ctx.fillRect(-68, -40, 128, 80)
  ctx.restore()
  ctx.beginPath(); ctx.arc(140, 104, 43, 0, 7); ctx.fillStyle = '#1b4b8f'; ctx.fill()
  ctx.beginPath(); ctx.moveTo(52, 128); ctx.lineTo(96, 50); ctx.lineTo(140, 128); ctx.closePath()
  ctx.fillStyle = 'rgba(242,179,61,.93)'; ctx.fill()

  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.14)'; ctx.shadowBlur = 5
  ctx.fillStyle = 'rgba(255,255,255,.95)'; rr(48, 78, 76, 26, 3); ctx.fill(); ctx.restore()
  T('LOGO', 86, 96, 13, '#1b1b1b', F.mono, 'center', '700')

  const cols = [['#E0325E', 'PRIMARY'], ['#1B4B8F', 'DEEP'], ['#F2B33D', 'ACCENT']]
  cols.forEach((col, i) => {
    const y = 34 + i * 42
    ctx.fillStyle = col[0]; rr(234, y, 22, 22, 4); ctx.fill()
    T(col[0], 264, y + 9, 6, '#4a463d', F.mono, 'left', '700')
    T(col[1], 264, y + 18, 4.5, '#9a9488', F.mono, 'left')
  })
  ctx.strokeStyle = 'rgba(40,36,30,.18)'; ctx.lineWidth = 1; ctx.setLineDash([4, 4])
  ctx.strokeRect(8, 8, 304, 164); ctx.setLineDash([])
  T('替换品牌色即可', 18, 172, 5.5, '#8d8678', F.mono, 'left', '700')
}

/* ============================================================
   S5-M27 无对白短片 —— 夜雨路灯 + 音效提示
   ============================================================ */
function M27() {
  const g = ctx.createLinearGradient(0, 0, 0, H)
  g.addColorStop(0, '#08111b'); g.addColorStop(0.6, '#132131'); g.addColorStop(1, '#1c2d3c')
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H)
  ctx.fillStyle = '#0b141c'; ctx.fillRect(0, 142, W, 38)
  ctx.beginPath(); ctx.ellipse(170, 150, 150, 11, 0, 0, 7)
  ctx.fillStyle = 'rgba(120,150,180,.08)'; ctx.fill()

  const gl = ctx.createRadialGradient(64, 62, 2, 64, 62, 78)
  gl.addColorStop(0, 'rgba(255,214,140,.5)'); gl.addColorStop(0.4, 'rgba(255,190,110,.12)')
  gl.addColorStop(1, 'rgba(255,180,100,0)')
  ctx.fillStyle = gl; ctx.fillRect(0, 0, 210, 180)

/* ============================================================
   S5-M37 Logo 慢慢拼出来 —— 碎片飞向中心
   ============================================================ */
function M37() {
  bg('#0e1620')
  const g = ctx.createRadialGradient(160, 84, 10, 160, 84, 160)
  g.addColorStop(0, 'rgba(40,90,80,.45)'); g.addColorStop(1, 'rgba(14,22,32,0)')
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H)

  const cx = 160, cy = 82, r1 = 19, r2 = 37
  const parts = [0, 1, 2, 4]
  for (let i = 0; i < 6; i++) {
    const a0 = -Math.PI / 2 + i * Math.PI / 3 - 0.42
    const a1 = -Math.PI / 2 + i * Math.PI / 3 + 0.42
    ctx.beginPath()
    ctx.arc(cx, cy, r2, a0, a1)
    ctx.arc(cx, cy, r1, a1, a0, true)
    ctx.closePath()
    if (parts.includes(i)) {
      ctx.fillStyle = i === 4 ? 'rgba(94,224,181,.55)' : '#5ee0b5'
      ctx.fill()
    } else {
      ctx.setLineDash([3, 3]); ctx.strokeStyle = 'rgba(94,224,181,.35)'; ctx.lineWidth = 1; ctx.stroke()
      ctx.setLineDash([])
    }
  }
  // 中心 L
  ctx.fillStyle = '#eafff7'
  ctx.fillRect(cx - 9, cy - 11, 6, 21)
  ctx.globalAlpha = 0.85; ctx.fillRect(cx - 9, cy + 4, 17, 6); ctx.globalAlpha = 1

  function shard(x, y, rot, s, alpha, fill) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot)
    ctx.beginPath(); ctx.moveTo(-s, 0)
    ctx.lineTo(-s * 0.2, -s * 0.8); ctx.lineTo(s * 0.9, -s * 0.3)
    ctx.lineTo(s * 0.6, s * 0.7); ctx.lineTo(-s * 0.4, s * 0.6); ctx.closePath()
    ctx.fillStyle = fill; ctx.fill()
    ctx.strokeStyle = 'rgba(94,224,181,.5)'; ctx.lineWidth = 0.8; ctx.stroke()
    ctx.restore()
  }
  const pieces = [
    [46, 36, 0.6, 9, 0.65], [64, 138, -0.4, 8, 0.5], [118, 26, 1.2, 7, 0.55],
    [204, 152, 0.2, 9, 0.6], [252, 46, -0.8, 8, 0.5], [274, 118, 1.6, 7, 0.45],
    [34, 96, 2.1, 6, 0.4], [232, 26, -1.5, 6, 0.35],
  ]
  pieces.forEach(([x, y, rot, s, a]) => {
    shard(x, y, rot, s, a, 'rgba(94,224,181,' + a + ')')
    // 运动轨迹
    ctx.beginPath()
    const mx = (x + cx) / 2 + (y < cy ? 16 : -16)
    const my = (y + cy) / 2 + (x < cx ? 12 : -12)
    ctx.moveTo(x, y); ctx.quadraticCurveTo(mx, my, cx + (x - cx) * 0.28, cy + (y - cy) * 0.28)
    ctx.setLineDash([2, 4]); ctx.strokeStyle = 'rgba(94,224,181,.2)'; ctx.lineWidth = 0.9
    ctx.stroke(); ctx.setLineDash([])
  })

  T('ASSEMBLING  68%', 16, 168, 5.5, 'rgba(94,224,181,.85)', F.mono, 'left', '700')
  ctx.fillStyle = 'rgba(94,224,181,.18)'; rr(16, 173, 120, 2.4, 1.2); ctx.fill()
  ctx.fillStyle = '#5ee0b5'; rr(16, 173, 81.6, 2.4, 1.2); ctx.fill()
  T('Logo 慢慢拼出来', 16, 24, 8.5, 'rgba(230,245,240,.9)', F.sans, 'left', '700')
  T('SHARDS → MARK', 16, 36, 4.6, 'rgba(120,170,160,.7)', F.mono, 'left', '700')
  T('片头 / 片尾', W - 16, 24, 5.5, 'rgba(120,170,160,.65)', F.sans, 'right')

  T('OK', xs[1] + s / 2, y + 4, 9, '#fff', F.mono, 'center', '700')

  // 3 加载圈
  ctx.beginPath(); ctx.arc(xs[2] + s / 2, y, 14, 0, 7)
  ctx.strokeStyle = '#e4e7ec'; ctx.lineWidth = 4; ctx.stroke()
  ctx.beginPath(); ctx.arc(xs[2] + s / 2, y, 14, -Math.PI / 2, 0.9)
  ctx.strokeStyle = '#0ea5e9'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.stroke()

  // 4 播放
  ctx.beginPath(); ctx.arc(xs[3] + s / 2, y, 16, 0, 7); ctx.fillStyle = '#101828'; ctx.fill()
  ctx.beginPath(); ctx.moveTo(xs[3] + 16, y - 7); ctx.lineTo(xs[3] + 25, y); ctx.lineTo(xs[3] + 16, y + 7)
  ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill()

  // 5 滑块
  ctx.fillStyle = '#e4e7ec'; rr(xs[4] + 2, y - 2, s - 4, 4, 2); ctx.fill()
  ctx.fillStyle = '#4f46e5'; rr(xs[4] + 2, y - 2, 22, 4, 2); ctx.fill()
  ctx.beginPath(); ctx.arc(xs[4] + 24, y, 6, 0, 7); ctx.fillStyle = '#4f46e5'; ctx.fill()
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6; ctx.stroke()

  // 6 开关
  ctx.fillStyle = '#10b981'; rr(xs[5] + 1, y - 10, s - 2, 20, 10); ctx.fill()
  ctx.beginPath(); ctx.arc(xs[5] + s - 12, y, 7, 0, 7); ctx.fillStyle = '#fff'; ctx.fill()

  for (let i = 0; i < 6; i++) {
    if (i < 5) T('›', xs[i] + s + 5, y + 5, 12, '#c3cad4', F.sans, 'center', '700')
    cursor(xs[i] + 24, y + 16)
    T(labels[i], xs[i] + s / 2, y + 34, 5.5, '#667085', F.sans, 'center')
  }

  L(16, 152, 304, 152, '#eaecf0', 1, [3, 4])
  T('同一形状 · 6 次状态变化 · 每次都点一下', 16, 166, 5.5, '#98a2b3', F.sans, 'left')
  T('MORPH', W - 16, 166, 5, '#c3cad4', F.mono, 'right', '700')
}

/* ============================================================
   S5-M39 占位-网格系统 —— 12 栏 + 基线 + 占位块
   ============================================================ */
function M39() {
  bg('#fbfbf9')
  const m = 16, gut = 6, cols = 12
  const cw = (W - 2 * m - gut * (cols - 1)) / cols

  // 基线网格
  for (let y = 0; y < H; y += 8) L(0, y, W, y, 'rgba(190,60,60,.10)', 0.6)
  // 栏
  for (let i = 0; i < cols; i++) {
    const x = m + i * (cw + gut)
    if (i % 2 === 0) { ctx.fillStyle = 'rgba(30,64,175,.045)'; ctx.fillRect(x, 26, cw, 132) }
    L(x, 26, x, 158, 'rgba(200,60,60,.28)', 0.6)
    L(x + cw, 26, x + cw, 158, 'rgba(200,60,60,.28)', 0.6)
  }
  // 边距线
  L(m, 26, m, 158, '#d64545', 1); L(W - m, 26, W - m, 158, '#d64545', 1)

  // 标尺
  L(0, 20, W, 20, 'rgba(60,60,60,.25)', 0.8)
  for (let x = 0; x <= 300; x += 20) {
    L(x + 10, 20, x + 10, x % 100 === 0 ? 14 : 17, 'rgba(60,60,60,.4)', 0.8)
    if (x % 100 === 0) T(String(x), x + 10, 12, 4.2, 'rgba(60,60,60,.55)', F.mono, 'center')
  }
  for (let y = 40; y < 170; y += 20) L(4, y, 10, y, 'rgba(60,60,60,.35)', 0.8)

  // 内容块
  const c6 = cw * 6 + gut * 5
  ctx.fillStyle = '#1e293b'; ctx.fillRect(m, 46, c6, 22)
  T('H1 标题占位', m + 8, 61, 9, '#fff', F.sans, 'left', '700')
  T('COL 1–6', m + c6 - 6, 60, 4.2, 'rgba(255,255,255,.55)', F.mono, 'right')

  ctx.fillStyle = '#cbd5e1'; ctx.fillRect(m, 76, cw * 4 + gut * 3, 26)
  ctx.fillStyle = '#94a3b8'; ctx.fillRect(m, 110, cw * 4 + gut * 3, 18)
  ctx.fillStyle = '#e2e8f0'; ctx.fillRect(m, 136, cw * 4 + gut * 3, 20)

  // 图片占位
  const ix = m + 6 * (cw + gut), iw = cw * 6 + gut * 5
  ctx.fillStyle = '#e2e8f0'; ctx.fillRect(ix, 46, iw, 110)
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 0.8
  ctx.beginPath(); ctx.moveTo(ix, 46); ctx.lineTo(ix + iw, 156)
  ctx.moveTo(ix + iw, 46); ctx.lineTo(ix, 156); ctx.stroke()
  T('IMG', ix + iw / 2, 104, 10, 'rgba(71,85,105,.5)', F.mono, 'center', '700')

  // 标注
  T('COL 1–6', m, 44, 4.2, '#d64545', F.mono, 'left', '700')
  T('COL 7–12', ix + iw, 44, 4.2, '#d64545', F.mono, 'right', '700')
  T('MARGIN 16', W - m, 174, 4.2, 'rgba(60,60,60,.45)', F.mono, 'right')
  T('GRID SYSTEM · 12 COL / 8 PT', m, 174, 4.6, 'rgba(60,60,60,.6)', F.mono, 'left', '700')
}

/* ============================================================
   S5-M40 占位-复古荧幕 —— CRT 圆角 + 扫描线 + 彩条
   ============================================================ */
function M40() {
  bg('#151110')
  const room = ctx.createRadialGradient(160, 90, 40, 160, 90, 220)
  room.addColorStop(0, 'rgba(120,70,40,.35)'); room.addColorStop(1, 'rgba(21,17,16,0)')
  ctx.fillStyle = room; ctx.fillRect(0, 0, W, H)

  // 机壳
  ctx.save(); ctx.shadowColor = 'rgba(255,160,80,.28)'; ctx.shadowBlur = 22
  const bez = ctx.createLinearGradient(0, 18, 0, 162)
  bez.addColorStop(0, '#6b5a4c'); bez.addColorStop(0.5, '#4a3d34'); bez.addColorStop(1, '#332a24')
  ctx.fillStyle = bez; rr(18, 18, 284, 144, 16); ctx.fill(); ctx.restore()
  ctx.strokeStyle = 'rgba(20,15,12,.8)'; ctx.lineWidth = 1.5
  rr(18, 18, 284, 144, 16); ctx.stroke()

  // 屏幕
  ctx.save()
  rr(34, 30, 252, 112, 9); ctx.clip()

  const bars = ['#c8c8c8', '#c8c800', '#00c8c8', '#00c800', '#c800c8', '#c80000', '#0000c8']
  const bw = 252 / 7
  bars.forEach((col, i) => {
    const x = 34 + i * bw
    const g = ctx.createLinearGradient(0, 30, 0, 118)
    g.addColorStop(0, col); g.addColorStop(0.75, col); g.addColorStop(1, 'rgba(0,0,0,.55)')
    ctx.fillStyle = g
    ctx.fillRect(x, 30, bw + 0.5, 88)
  })
  // 测试图下沿
  const low = [['#1b1b1b', 34, 42], ['#ffffff', 76, 42], ['#0a2a6a', 118, 42], ['#101010', 160, 42], ['#7b7b7b', 202, 42], ['#000000', 244, 42]]
  low.forEach(([col, x, w]) => { ctx.fillStyle = col; ctx.fillRect(x, 118, w, 24) })
  ctx.fillStyle = '#ffffff'; ctx.fillRect(34, 118, 252, 1.4)

  // 扫描线
  ctx.fillStyle = 'rgba(0,0,0,.22)'
  for (let y = 30; y < 142; y += 3) ctx.fillRect(34, y, 252, 1)
  // 滚动条带
  const band = ctx.createLinearGradient(0, 66, 0, 88)
  band.addColorStop(0, 'rgba(255,255,255,0)'); band.addColorStop(0.5, 'rgba(255,255,255,.09)')
  band.addColorStop(1, 'rgba(255,255,255,0)')
  ctx.fillStyle = band; ctx.fillRect(34, 66, 252, 22)
  // 暗角
  const vg = ctx.createRadialGradient(160, 86, 40, 160, 86, 160)
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)')
  ctx.fillStyle = vg; ctx.fillRect(34, 30, 252, 112)
  // 玻璃反光
  ctx.beginPath(); ctx.moveTo(34, 30); ctx.lineTo(120, 30); ctx.lineTo(60, 142); ctx.lineTo(34, 142)
  ctx.closePath(); ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fill()
  ctx.restore()

  ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.lineWidth = 2
  rr(34, 30, 252, 112, 9); ctx.stroke()

  // 旋钮与标签
  ctx.beginPath(); ctx.arc(284, 152, 4.4, 0, 7); ctx.fillStyle = '#2b231e'; ctx.fill()
  ctx.strokeStyle = 'rgba(230,200,170,.35)'; ctx.lineWidth = 1; ctx.stroke()
  ctx.beginPath(); ctx.arc(270, 152, 3.4, 0, 7); ctx.fill()
  ctx.stroke()
  T('CH 03', 40, 156, 6, 'rgba(232,207,176,.8)', F.mono, 'left', '700')
  ctx.beginPath(); ctx.arc(296, 152, 2, 0, 7); ctx.fillStyle = '#c8303e'; ctx.fill()

  T('复古荧幕 · CRT', W - 14, 12, 5.5, 'rgba(230,200,170,.45)', F.mono, 'right', '700')
}
