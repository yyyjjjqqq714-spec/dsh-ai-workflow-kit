<!doctype html>
<html lang="zh">
<head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#111;overflow:hidden}canvas{display:block;width:320px;height:180px}</style>
</head>
<body>
<canvas id="c" width="320" height="180"></canvas>
<script>
const W = 320, H = 180
const c = document.getElementById('c')
const ctx = c.getContext('2d')
const id = new URLSearchParams(location.search).get('id') || 'S5-M14_'
const F = { sans: '"Microsoft YaHei",sans-serif', serif: '"SimSun",serif', hand: '"KaiTi",serif', mono: '"Consolas",monospace' }

let _s = 20261104
function rnd(){ _s = (_s * 1103515245 + 12345) & 0x7fffffff; return _s / 0x7fffffff }
function rn(a,b){ return a + (b-a)*rnd() }
function bg(col){ ctx.fillStyle = col; ctx.fillRect(0,0,W,H) }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath() }
function T(s,x,y,size,col,font,align,weight){
  ctx.fillStyle = col
  ctx.font = (weight||'400') + ' ' + size + 'px ' + (font||F.sans)
  ctx.textAlign = align || 'left'
  ctx.textBaseline = 'alphabetic'
  ctx.fillText(s,x,y)
}

/* M14 手绘定格 · 多角色互动：三个小人 + 手绘气泡 */
function M14(){
  bg('#f3ece0')
  // 纸纹
  ctx.fillStyle = 'rgba(120,105,85,.05)'
  for(let i=0;i<80;i++) ctx.fillRect(rn(0,W), rn(0,H), rn(1,3), 1)
  // 地面线
  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 3; ctx.lineCap = 'round'
  ctx.beginPath(); ctx.moveTo(40,150); ctx.lineTo(280,150); ctx.stroke()
  // 三个小人（不同姿势）
  const people = [[78,'站'],[158,'探身'],[238,'举手']]
  for(const [x,pose] of people){
    ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 3
    ctx.beginPath(); ctx.arc(x, 96, 11, 0, 7); ctx.stroke()      // 头
    if(pose === '探身'){ ctx.beginPath(); ctx.moveTo(x,107); ctx.lineTo(x+14,138); ctx.stroke() }
    else { ctx.beginPath(); ctx.moveTo(x,107); ctx.lineTo(x,138); ctx.stroke() }
    ctx.beginPath(); ctx.moveTo(x,118); ctx.lineTo(x-12,134); ctx.stroke()
    ctx.beginPath(); ctx.moveTo(x,118); ctx.lineTo(x+12,134); ctx.stroke()
    if(pose === '举手'){ ctx.beginPath(); ctx.moveTo(x,112); ctx.lineTo(x-14,88); ctx.stroke() }
  }
  // 手绘气泡
  const bub = (x,y,w,h,t) => {
    ctx.strokeStyle='#2b2b2b'; ctx.lineWidth=2
    ctx.beginPath(); ctx.ellipse(x,y,w,h,0,0,7); ctx.stroke()
    ctx.beginPath(); ctx.moveTo(x-6,y+h); ctx.lineTo(x-2,y+h+10); ctx.lineTo(x+6,y+h-2); ctx.stroke()
    T(t,x,y+4,10,'#2b2b2b',F.hand,'center','700')
  }
  bub(78,72,26,15,'嗯')
  bub(238,72,30,15,'我来')
  // 铅笔回描的抖动痕
  ctx.strokeStyle = 'rgba(43,43,43,.35)'; ctx.lineWidth = 1.5
  ctx.beginPath(); ctx.moveTo(44,152); ctx.lineTo(276,152); ctx.stroke()
  T('FRAME 08 · 12fps',12,20,8,'rgba(60,55,45,.5)',F.mono)
}

/* M15 定格动画 · 物件替换：一只手 + 拆装零件 */
function M15(){
  const g = ctx.createLinearGradient(0,0,0,H)
  g.addColorStop(0,'#e9dfca'); g.addColorStop(1,'#cdbfa3')
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H)
  // 桌面
  ctx.fillStyle = '#8a6a45'; ctx.fillRect(0,120,W,60)
  ctx.fillStyle = '#a57f52'; ctx.fillRect(0,120,W,6)
  // 四个零件（拆开摆放）
  const parts = [[60,96,'#5b7f95'],[120,88,'#c98a4b'],[190,96,'#7a9e6e'],[250,84,'#b5654a']]
  for(const [x,y,col] of parts){
    ctx.fillStyle = col
    rr(x-14,y-14,28,28,6); ctx.fill()
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2; ctx.stroke()
  }
  // 手（只露手掌和手指）
  ctx.fillStyle = '#e8c9a8'
  ctx.beginPath(); ctx.ellipse(160, 142, 26, 16, -.2, 0, 7); ctx.fill()
  ctx.beginPath(); ctx.ellipse(146, 126, 6, 13, -.35, 0, 7); ctx.fill()
  // 手指间夹着一个零件
  ctx.fillStyle = '#8b6b4a'
  rr(132,108,16,16,3); ctx.fill()
  // 虚线箭头（示意下一步）
  ctx.strokeStyle = 'rgba(60,50,40,.5)'; ctx.lineWidth = 1.5; ctx.setLineDash([4,4])
  ctx.beginPath(); ctx.moveTo(150,100); ctx.lineTo(176,92); ctx.stroke()
  ctx.setLineDash([])
  T('STOP MOTION · 24fps',12,20,8,'rgba(60,50,40,.55)',F.mono)
  T('一格一换 · 禁插值',12,166,9,'rgba(60,50,40,.6)',F.hand)
}

/* M16 逐帧抖动 · 线条生长：单根发光细线 + 三重错位重影 */
function M16(){
  bg('#101418')
  // 主曲线
  const path = (off, alpha, width) => {
    ctx.beginPath()
    for(let x=20;x<=300;x+=4){
      const y = 110 + Math.sin(x*0.045 + off) * 34 + Math.sin(x*0.11 + off*2) * 9
      x === 20 ? ctx.moveTo(x,y) : ctx.lineTo(x,y)
    }
    ctx.strokeStyle = `rgba(120,220,255,${alpha})`
    ctx.lineWidth = width; ctx.shadowColor = '#5ad8ff'; ctx.shadowBlur = 10
    ctx.stroke(); ctx.shadowBlur = 0
  }
  path(0, .95, 2)
  path(.12, .45, 1.4)
  path(-.12, .35, 1.4)
  // 生长点光晕
  const hx = 300, hy = 110 + Math.sin(300*0.045) * 34 + Math.sin(300*0.11) * 9
  const glow = ctx.createRadialGradient(hx,hy,1,hx,hy,16)
  glow.addColorStop(0,'rgba(150,235,255,.9)'); glow.addColorStop(1,'rgba(150,235,255,0)')
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(hx,hy,16,0,7); ctx.fill()
  // 抖动衰减标记
  T('JITTER 1.5px → 0.3px',12,20,8,'rgba(120,200,230,.55)',F.mono)
  T('逐帧抖动 · 线条生长',12,166,9,'rgba(190,225,240,.7)',F.hand)
}

/* M17 手绘 + 实拍混合：窗光实拍底 + 马克笔涂鸦 */
function M17(){
  // 实拍感底：窗光 + 浅景深
  const g = ctx.createRadialGradient(210,50,20,210,50,200)
  g.addColorStop(0,'#f4e8cf'); g.addColorStop(.5,'#c9b391'); g.addColorStop(1,'#6e5c46')
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H)
  // 窗框剪影
  ctx.fillStyle = 'rgba(60,48,36,.55)'
  ctx.fillRect(196,10,6,120); ctx.fillRect(256,10,6,120)
  ctx.fillRect(196,64,66,5)
  // 桌面
  ctx.fillStyle = 'rgba(90,68,46,.85)'; ctx.fillRect(0,132,W,48)
  // 颗粒
  for(let i=0;i<500;i++){ ctx.fillStyle = `rgba(255,255,255,${rnd()*0.06})`; ctx.fillRect(rn(0,W),rn(0,H),1,1) }
  // 暗角
  const vg = ctx.createRadialGradient(160,90,60,160,90,200)
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.45)')
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H)
  // 马克笔涂鸦（不漂移，盖在实拍上）
  ctx.strokeStyle = '#ffd447'; ctx.lineWidth = 6; ctx.lineCap = 'round'
  ctx.beginPath(); ctx.moveTo(40,70); ctx.quadraticCurveTo(80,40,120,66); ctx.stroke()
  ctx.strokeStyle = '#e04b3a'; ctx.lineWidth = 4
  ctx.beginPath(); ctx.arc(70,110,22,0,7); ctx.stroke()
  T('划重点',46,118,14,'#e04b3a',F.hand,'left','700')
  T('HAND + LIVE ACTION',12,20,8,'rgba(255,245,220,.6)',F.mono)
}

/* M26 副歌段落 · 画面爆炸：由静到炸 + shockwave */
function M26(){
  bg('#0a0a12')
  // 收窄压暗的核心
  const core = ctx.createRadialGradient(160,90,2,160,90,46)
  core.addColorStop(0,'#fff3c4'); core.addColorStop(.35,'#ff9e3d'); core.addColorStop(1,'rgba(120,20,60,0)')
  ctx.fillStyle = core; ctx.beginPath(); ctx.arc(160,90,46,0,7); ctx.fill()
  // 放射线
  for(let i=0;i<36;i++){
    const a = i/36*Math.PI*2 + rn(-.03,.03)
    const len = rn(60,150)
    ctx.strokeStyle = `rgba(255,${120+Math.floor(rn(0,90))},${60+Math.floor(rn(0,90))},${rn(.15,.55)})`
    ctx.lineWidth = rn(1,3)
    ctx.beginPath(); ctx.moveTo(160+Math.cos(a)*50, 90+Math.sin(a)*50)
    ctx.lineTo(160+Math.cos(a)*len, 90+Math.sin(a)*len); ctx.stroke()
  }
  // 双 shockwave
  for(const r of [70, 104]){
    ctx.strokeStyle = `rgba(255,220,160,${r===70?.5:.3})`
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(160,90,r,0,7); ctx.stroke()
  }
  // 粒子（少量，强调对比不堆量）
  for(let i=0;i<26;i++){
    ctx.fillStyle = `rgba(255,${180+Math.floor(rn(0,70))},120,${rn(.4,.9)})`
    const a = rn(0,7), d = rn(50,140)
    ctx.fillRect(160+Math.cos(a)*d, 90+Math.sin(a)*d, 2, 2)
  }
  T('CHORUS DROP · 2.0s',12,20,8,'rgba(255,190,120,.6)',F.mono)
  T('静 → 炸',12,166,10,'rgba(255,220,170,.8)',F.hand,'left','700')
}

/* M35 数据播报 · 数字滚动：大数字 + ticker */
function M35(){
  bg('#0d1a26')
  // 网格
  ctx.strokeStyle = 'rgba(90,150,190,.10)'; ctx.lineWidth = 1
  for(let x=0;x<W;x+=20){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke() }
  for(let y=0;y<H;y+=20){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke() }
  // 大数字（逐位滚动，用多行错位模拟）
  T('1,284,930',160,86,44,'#7ee0ff',F.mono,'center','700')
  // 单位
  T('+18.4%',160,108,14,'#5aff9e',F.mono,'center','700')
  // 上下的滚动残影
  ctx.globalAlpha = .25
  T('1,284,929',160,52,44,'#7ee0ff',F.mono,'center','700')
  T('1,284,931',160,132,44,'#7ee0ff',F.mono,'center','700')
  ctx.globalAlpha = 1
  // 底部 ticker
  ctx.fillStyle = '#132838'; ctx.fillRect(0,148,W,20)
  ctx.fillStyle = '#5aff9e'
  T('◉ LIVE  数据播报 · 实时刷新',12,162,9,F.mono,'left','700')
  // 顶栏
  T('DATA CAST · 24/7',12,20,8,'rgba(126,224,255,.55)',F.mono)
}

/* M39 形状 × 文字联动：文字沿轮廓，形状先动 */
function M39(){
  bg('#f7f4ec')
  // 主形状：圆角矩形轮廓
  ctx.strokeStyle = '#1f3a5f'; ctx.lineWidth = 3
  rr(70,40,180,100,40); ctx.stroke()
  // 形状内填充半透明
  ctx.fillStyle = 'rgba(31,58,95,.06)'; ctx.fill()
  // 文字沿轮廓弧长排布
  const text = 'SHAPE  FOLLOWS  TEXT'
  ctx.fillStyle = '#e8734a'
  ctx.font = '700 13px ' + F.mono
  let px = 0
  for(const ch of text){
    if(ch === ' '){ px += 7; continue }
    // 沿圆角矩形顶部走线
    const x = 78 + px
    const y = 40
    ctx.save(); ctx.translate(x,y); ctx.rotate(-0.05)
    ctx.fillText(ch,0,0); ctx.restore()
    px += 13
  }
  // 底部跟随的文字（错位 0.1s）
  ctx.fillStyle = 'rgba(232,115,74,.55)'
  ctx.font = '700 13px ' + F.mono
  px = 0
  for(const ch of text){
    if(ch === ' '){ px += 7; continue }
    ctx.fillText(ch, 78 + px, 142)
    px += 13
  }
  T('MOLD · STAGGER 0.1s',12,20,8,'rgba(31,58,95,.5)',F.mono)
  T('形状 × 文字',12,166,10,'rgba(31,58,95,.85)',F.hand,'left','700')
}

/* M40 动态风格总结 · 蒙太奇：多格 + 圆点串场 */
function M40(){
  bg('#12141a')
  const cells = [
    [4,4,74,52,'#ff5d5d'],[82,4,74,52,'#5dd6ff'],[160,4,74,52,'#ffd75d'],[238,4,74,52,'#8bff8b'],
    [4,60,104,52,'#c38bff'],[112,60,104,52,'#ff9e3d'],[220,60,92,52,'#4f7cff'],
    [4,116,150,58,'#1f7a35'],[158,116,154,58,'#b03a2e'],
  ]
  for(const [x,y,w,h,col] of cells){
    ctx.fillStyle = col + '33'
    ctx.fillRect(x,y,w,h)
    ctx.strokeStyle = col; ctx.lineWidth = 1.5
    ctx.strokeRect(x,y,w,h)
  }
  // 每格一个示意图形
  ctx.fillStyle = '#ffffff'
  const marks = [[41,30],[119,30],[197,30],[275,30],[56,86],[164,86],[266,86],[79,145],[235,145]]
  for(const [x,y] of marks){ ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fill() }
  // 串场的小圆点（6px）
  ctx.fillStyle = '#fff'
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 8
  ctx.beginPath(); ctx.arc(160,90,3,0,7); ctx.fill()
  ctx.shadowBlur = 0
  T('MONTAGE · 12 CUTS × 0.4s',12,172,7,'rgba(255,255,255,.5)',F.mono)
}

const DRAW = {'S5-M14_':M14,'S5-M15_':M15,'S5-M16_':M16,'S5-M17_':M17,'S5-M26_':M26,'S5-M35_':M35,'S5-M39_':M39,'S5-M40_':M40}
;(DRAW[id] || M14)()
window.__DONE__ = true
</script>
</body>
</html>
