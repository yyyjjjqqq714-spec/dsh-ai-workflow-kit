<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  canvas{display:block;width:320px;height:180px}
</style>
</head>
<body>
<canvas id="c" width="320" height="180"></canvas>
<script>
const W = 320, H = 180
const c = document.getElementById('c')
const ctx = c.getContext('2d')
const id = new URLSearchParams(location.search).get('id') || 'S8-V1'

const F = {
  sans: '"Microsoft YaHei","PingFang SC",sans-serif',
  serif: '"SimSun","Songti SC",serif',
  hand: '"KaiTi","STKaiti",serif',
  mono: '"Consolas","Courier New",monospace',
}

/* ---------- 工具 ---------- */
function rng(seed) {
  let s = seed >>> 0
  return function () {
    s = (s + 0x6D2B79F5) >>> 0
    let t = Math.imul(s ^ (s >>> 15), 1 | s)
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
}
function rr(x, y, w, h, r) {
  ctx.beginPath()
  ctx.moveTo(x + r, y)
  ctx.arcTo(x + w, y, x + w, y + h, r)
  ctx.arcTo(x + w, y + h, x, y + h, r)
  ctx.arcTo(x, y + h, x, y, r)
  ctx.arcTo(x, y, x + w, y, r)
  ctx.closePath()
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2) }
function poly(pts, close) {
  ctx.beginPath()
  for (let i = 0; i < pts.length; i++) i ? ctx.lineTo(pts[i][0], pts[i][1]) : ctx.moveTo(pts[i][0], pts[i][1])
  if (close) ctx.closePath()
}
function star(cx, cy, R, spikes, innerRatio, rot) {
  const pts = []
  for (let i = 0; i < spikes * 2; i++) {
    const r = i % 2 ? R * innerRatio : R
    const a = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2 + (rot || 0)
    pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r])
  }
  return pts
}

/* ================================================================
   S8-V1 逐帧手绘抖动线条  —— 米白纸 + 三重抖动墨线（boiling line）
   ================================================================ */
function v1() {
  const R = rng(31)
  ctx.fillStyle = '#f4efe2'; ctx.fillRect(0, 0, W, H)
  // 纸面颗粒
  for (let i = 0; i < 260; i++) {
    ctx.fillStyle = `rgba(120,108,88,${0.03 + R() * 0.05})`
    ctx.fillRect(R() * W, R() * H, 1.4, 1.4)
  }
  const ink = '#211f1c'
  function wl(x1, y1, x2, y2, amp, segs) {
    ctx.beginPath()
    for (let i = 0; i <= segs; i++) {
      const t = i / segs
      const x = x1 + (x2 - x1) * t + (R() - .5) * 2 * amp
      const y = y1 + (y2 - y1) * t + (R() - .5) * 2 * amp
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)
    }
    ctx.stroke()
  }
  function wc(cx, cy, rad, amp) {
    const n = 44
    ctx.beginPath()
    for (let i = 0; i <= n; i++) {
      const a = i / n * Math.PI * 2
      const r0 = rad + (R() - .5) * 2 * amp
      const x = cx + Math.cos(a) * r0, y = cy + Math.sin(a) * r0
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)
    }
    ctx.stroke()
  }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'
  ctx.strokeStyle = ink

  // 外框：三重抖动
  for (let p = 0; p < 3; p++) {
    ctx.globalAlpha = [0.9, 0.45, 0.3][p]
    ctx.lineWidth = [1.7, 1.2, 1][p]
    wl(10, 12, 300, 12, 1.5, 16)
    wl(300, 12, 300, 168, 1.5, 12)
    wl(300, 168, 10, 168, 1.5, 16)
    wl(10, 168, 10, 12, 1.5, 12)
  }
  // 灯泡主体
  for (let p = 0; p < 3; p++) {
    ctx.globalAlpha = [0.95, 0.5, 0.35][p]
    ctx.lineWidth = [2.2, 1.5, 1.2][p]
    wc(140, 84, 30, 1.7)
    // 灯头
    ctx.beginPath()
    wl(128, 112, 128, 126, 1.4, 4)
    wl(152, 112, 152, 126, 1.4, 4)
    wl(124, 126, 156, 126, 1.4, 4)
    wl(126, 132, 154, 132, 1.4, 4)
    wl(130, 138, 150, 138, 1.4, 4)
    // 灯丝
    wl(136, 100, 134, 92, 1.3, 4)
    wl(134, 92, 145, 92, 1.3, 4)
    wl(145, 92, 143, 100, 1.3, 4)
  }
  ctx.globalAlpha = 1
  // 光芒：短线
  for (let p = 0; p < 2; p++) {
    ctx.globalAlpha = p ? 0.4 : 0.85
    ctx.lineWidth = p ? 1.2 : 1.8
    const rays = [[140, 44, 140, 28], [186, 62, 202, 54], [96, 60, 82, 50],
                  [196, 96, 212, 96], [84, 96, 68, 100], [176, 126, 188, 138],
                  [104, 124, 92, 136]]
    for (const [x1, y1, x2, y2] of rays) wl(x1, y1, x2, y2, 1.6, 4)
  }
  // 云朵虚线
  ctx.globalAlpha = 0.7
  ctx.lineWidth = 1.3
  wc(250, 44, 14, 1.6)
  wc(268, 46, 10, 1.6)
  // 红笔批注：小箭头 + 下划线
  ctx.strokeStyle = '#c0392b'; ctx.globalAlpha = 0.9
  ctx.lineWidth = 1.6
  wl(212, 142, 176, 124, 1.4, 6)
  ctx.beginPath()
  ctx.moveTo(176, 124); ctx.lineTo(184, 122); ctx.moveTo(176, 124); ctx.lineTo(182, 130); ctx.stroke()
  ctx.strokeStyle = ink

  // 抖动标题（双写）
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'
  ctx.fillStyle = ink
  for (let p = 0; p < 2; p++) {
    ctx.globalAlpha = p ? 0.45 : 0.95
    ctx.font = '700 21px ' + F.hand
    ctx.fillText('手绘抖动', 26, 46 + p * 1.2)
  }
  ctx.globalAlpha = 0.9
  ctx.font = '700 11px ' + F.hand
  ctx.fillStyle = '#c0392b'
  ctx.fillText('逐帧重画', 26, 64)
  // 抖动下划线
  ctx.globalAlpha = 0.75
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 1.4
  wl(26, 68, 96, 68, 1.6, 7)
  ctx.strokeStyle = ink
  ctx.globalAlpha = 1
  // 帧序号
  ctx.font = '9px ' + F.mono
  ctx.fillStyle = 'rgba(33,31,28,.55)'
  ctx.fillText('FRAME 013        24fps', 26, 158)
}

/* ================================================================
   S8-V3 扁平矢量 —— 纯色块、零阴影、零渐变
   ================================================================ */
function v3() {
  const cream = '#f6eedd', sun = '#f2a340', deep = '#12333a',
        m1 = '#1f6f6b', m2 = '#2f9189', coral = '#e0654f',
        yellow = '#f7d35b', white = '#fbf7ee'
  ctx.fillStyle = cream; ctx.fillRect(0, 0, W, H)
  // 太阳
  ctx.fillStyle = sun; circle(246, 44, 24); ctx.fill()
  // 云：纯色块
  ctx.fillStyle = white
  ctx.fillRect(46, 40, 44, 12); ctx.fillRect(58, 32, 22, 10)
  ctx.fillRect(180, 30, 30, 9)
  // 远山
  poly([[0, 118], [58, 62], [116, 118]], true); ctx.fillStyle = m2; ctx.fill()
  poly([[86, 118], [152, 70], [214, 118]], true); ctx.fillStyle = m1; ctx.fill()
  // 珊瑚色丘陵
  ctx.beginPath()
  ctx.moveTo(0, 130)
  ctx.quadraticCurveTo(96, 92, 196, 128)
  ctx.quadraticCurveTo(260, 146, 320, 118)
  ctx.lineTo(320, 180); ctx.lineTo(0, 180); ctx.closePath()
  ctx.fillStyle = coral; ctx.fill()
  // 深色地面
  ctx.fillStyle = deep; ctx.fillRect(0, 148, W, 32)
  // 房子：纯几何
  ctx.fillStyle = white; ctx.fillRect(214, 104, 40, 30)
  poly([[208, 104], [234, 84], [260, 104]], true); ctx.fillStyle = m1; ctx.fill()
  ctx.fillStyle = yellow; ctx.fillRect(228, 116, 10, 10)
  ctx.fillStyle = sun; ctx.fillRect(244, 116, 6, 10)
  // 树
  ctx.fillStyle = m1; ctx.fillRect(56, 120, 4, 20)
  ctx.fillStyle = '#1b5a52'; circle(58, 112, 15); ctx.fill()
  // 河
  ctx.fillStyle = '#2a7d8a'; ctx.fillRect(0, 140, 132, 5)
  // 文字条
  ctx.fillStyle = deep; ctx.fillRect(16, 14, 88, 20)
  ctx.fillStyle = white
  ctx.font = '700 13px ' + F.sans
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'
  ctx.fillText('扁平矢量', 25, 25)
  ctx.fillStyle = deep
  ctx.font = '8px ' + F.mono
  ctx.fillText('FLAT · NO SHADOW · NO GRADIENT', 16, 172)
}

/* ================================================================
   S8-V4 线条画 —— 白底、单线一笔勾勒、大面积留白
   ================================================================ */
function v4() {
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H)
  ctx.strokeStyle = '#141414'
  ctx.lineWidth = 1.7
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'

  // 一条不断线的侧脸
  ctx.beginPath()
  ctx.moveTo(84, 172)
  ctx.bezierCurveTo(88, 150, 96, 146, 98, 136)
  ctx.bezierCurveTo(100, 124, 92, 120, 90, 106)
  ctx.bezierCurveTo(86, 86, 92, 62, 112, 52)
  ctx.bezierCurveTo(134, 42, 158, 48, 168, 64)
  ctx.bezierCurveTo(174, 74, 170, 84, 165, 90)
  ctx.bezierCurveTo(160, 96, 168, 98, 170, 104)
  ctx.bezierCurveTo(172, 110, 186, 112, 184, 118)
  ctx.bezierCurveTo(182, 123, 172, 120, 168, 124)
  ctx.bezierCurveTo(166, 127, 172, 130, 170, 133)
  ctx.bezierCurveTo(168, 136, 160, 135, 158, 139)
  ctx.bezierCurveTo(157, 146, 164, 148, 162, 156)
  ctx.bezierCurveTo(160, 164, 154, 168, 152, 172)
  ctx.stroke()

  // 头发：三笔
  ctx.lineWidth = 1.3
  ctx.beginPath(); ctx.moveTo(112, 52); ctx.bezierCurveTo(120, 70, 118, 96, 108, 112); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(126, 46); ctx.bezierCurveTo(136, 62, 134, 88, 126, 104); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(146, 44); ctx.bezierCurveTo(152, 58, 150, 74, 144, 84); ctx.stroke()
  // 耳
  ctx.beginPath()
  ctx.moveTo(96, 104)
  ctx.bezierCurveTo(84, 100, 82, 116, 94, 118)
  ctx.stroke()
  // 眼 + 眉
  ctx.beginPath(); ctx.moveTo(136, 82); ctx.bezierCurveTo(146, 78, 152, 80, 156, 84); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(151, 92); ctx.quadraticCurveTo(158, 88, 163, 91); ctx.stroke()
  // 颈线延伸
  ctx.beginPath(); ctx.moveTo(118, 140); ctx.bezierCurveTo(126, 156, 120, 164, 116, 172); ctx.stroke()

  // 一点红：唯一的颜色
  ctx.fillStyle = '#d6452f'
  circle(258, 128, 5); ctx.fill()

  // 右侧竖排小标题
  ctx.fillStyle = '#141414'
  ctx.font = '400 19px ' + F.serif
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.fillText('一', 272, 56)
  ctx.fillText('笔', 272, 78)
  ctx.font = '7px ' + F.mono
  ctx.fillStyle = 'rgba(20,20,20,.45)'
  ctx.textAlign = 'left'
  ctx.fillText('ONE-LINE', 244, 108)
  ctx.fillText('DRAWING', 244, 118)
  // 左下角技术注记
  ctx.font = '8px ' + F.mono
  ctx.fillStyle = 'rgba(20,20,20,.5)'
  ctx.fillText('01 / continuous line, no fill', 18, 168)
  // 极细网格（留白基准）
  ctx.strokeStyle = 'rgba(20,20,20,.05)'; ctx.lineWidth = 1
  for (let x = 20; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 24); ctx.lineTo(x, 150); ctx.stroke() }
}

/* ================================================================
   S8-V6 形变 —— 圆→圆角方→五角星 的插值序列
   ================================================================ */
function v6() {
  const g = ctx.createLinearGradient(0, 0, W, H)
  g.addColorStop(0, '#1a1030'); g.addColorStop(1, '#0d0a1c')
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H)
  // 背景细格
  ctx.strokeStyle = 'rgba(255,255,255,.045)'; ctx.lineWidth = 1
  for (let x = 0; x < W; x += 20) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke() }
  for (let y = 0; y < H; y += 20) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke() }

  const smooth = t => t * t * (3 - 2 * t)
  function radius(a, u) {
    const sq = 1 / Math.max(Math.abs(Math.cos(a)), Math.abs(Math.sin(a)))
    const st = 0.40 + 0.60 * Math.pow(Math.abs(Math.cos(2.5 * a + 0.785)), 1.7)
    if (u < 0.5) { const t = smooth(u * 2); return (1 - t) * 1 + t * sq * 0.94 }
    const t = smooth((u - 0.5) * 2); return (1 - t) * sq * 0.94 + t * st
  }
  const N = 6, Rn = 21, y0 = 96
  for (let k = 0; k < N; k++) {
    const u = k / (N - 1)
    const cx = 42 + k * 47
    const grad = ctx.createLinearGradient(cx - Rn, y0 - Rn, cx + Rn, y0 + Rn)
    grad.addColorStop(0, '#8b5cf6'); grad.addColorStop(.55, '#4f46e5'); grad.addColorStop(1, '#22d3ee')
    ctx.beginPath()
    for (let i = 0; i <= 80; i++) {
      const a = i / 80 * Math.PI * 2
      const r = radius(a, u) * Rn
      const x = cx + Math.cos(a) * r, y = y0 + Math.sin(a) * r
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)
    }
    ctx.closePath()
    const tk = k / (N - 1)
    ctx.globalAlpha = 0.45 + 0.55 * tk
    ctx.fillStyle = grad; ctx.fill()
    ctx.globalAlpha = 0.4 + 0.6 * tk
    ctx.strokeStyle = 'rgba(186,200,255,.8)'; ctx.lineWidth = 1.1; ctx.stroke()
    if (k === N - 1) {
      ctx.globalAlpha = 1
      ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 1.5; ctx.stroke()
      ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 14; ctx.stroke(); ctx.shadowBlur = 0
    }
  }
  ctx.globalAlpha = 1
  // 时间轴
  ctx.strokeStyle = 'rgba(165,180,252,.45)'; ctx.lineWidth = 1
  ctx.beginPath(); ctx.moveTo(22, 128); ctx.lineTo(292, 128); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(292, 128); ctx.lineTo(285, 124); ctx.moveTo(292, 128); ctx.lineTo(285, 132); ctx.stroke()
  ctx.fillStyle = 'rgba(165,180,252,.55)'
  ctx.font = '6px ' + F.mono
  ctx.fillText('0%', 22, 138); ctx.fillText('50%', 152, 138); ctx.fillText('100%', 276, 138)
  // 标注
  ctx.fillStyle = '#a5b4fc'
  ctx.font = '700 8px ' + F.mono
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'
  ctx.fillText('MORPH  t=0.00', 20, 26)
  ctx.textAlign = 'right'
  ctx.fillText('t=1.00', 300, 26)
  ctx.textAlign = 'left'
  ctx.strokeStyle = 'rgba(165,180,252,.35)'; ctx.lineWidth = 1
  ctx.beginPath(); ctx.moveTo(20, 32); ctx.lineTo(300, 32); ctx.stroke()
  // 底部标签
  ctx.fillStyle = '#e9e6ff'
  ctx.font = '700 13px ' + F.sans
  ctx.fillText('形状渐变', 20, 152)
  ctx.fillStyle = 'rgba(165,180,252,.75)'
  ctx.font = '8px ' + F.mono
  ctx.fillText('circle → squircle → star   (radial interpolation)', 20, 166)
}

/* ================================================================
   S8-V7 贴纸讲解 —— 白边贴纸 + 投影 + 手绘虚线
   ================================================================ */
function v7() {
  const bg = '#e7edf4'
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H)
  // 背景点阵
  ctx.fillStyle = 'rgba(120,140,165,.16)'
  for (let y = 10; y < H; y += 14) for (let x = 10; x < W; x += 14) { ctx.fillRect(x, y, 2, 2) }

  function stickerShadow() {
    ctx.shadowColor = 'rgba(40,60,90,.28)'
    ctx.shadowBlur = 6; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 3
  }
  function clearShadow() { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0 }

  // 1) 对话气泡贴纸
  ctx.save(); ctx.translate(104, 78); ctx.rotate(-.05)
  stickerShadow()
  ctx.fillStyle = '#ffffff'
  rr(-56, -34, 112, 68, 18); ctx.fill()
  clearShadow()
  ctx.fillStyle = '#f45b69'
  rr(-49, -27, 98, 54, 14); ctx.fill()
  // 尾巴
  ctx.fillStyle = '#ffffff'
  poly([[-14, 34], [2, 34], [-10, 52]], true); ctx.fill()
  ctx.fillStyle = '#f45b69'
  poly([[-14, 30], [4, 30], [-9, 46]], true); ctx.fill()
  ctx.fillStyle = '#fff'
  ctx.font = '700 22px ' + F.sans
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.fillText('讲清楚', 0, -2)
  ctx.font = '8px ' + F.mono
  ctx.fillStyle = 'rgba(255,255,255,.8)'
  ctx.fillText('STEP 01', 0, 16)
  ctx.restore()

  // 2) 星星贴纸
  ctx.save(); ctx.translate(250, 58); ctx.rotate(.18)
  stickerShadow()
  ctx.fillStyle = '#fff'
  poly(star(0, 0, 33, 5, .46, 0), true); ctx.fill()
  clearShadow()
  ctx.fillStyle = '#ffc93c'
  poly(star(0, 0, 25, 5, .46, 0), true); ctx.fill()
  ctx.fillStyle = '#8a5a00'
  ctx.font = '700 13px ' + F.sans
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.fillText('!', 0, 1)
  ctx.restore()

  // 3) 对勾圆贴纸
  ctx.save(); ctx.translate(252, 138); ctx.rotate(-.12)
  stickerShadow()
  ctx.fillStyle = '#fff'; circle(0, 0, 25); ctx.fill()
  clearShadow()
  ctx.fillStyle = '#31c48d'; circle(0, 0, 18); ctx.fill()
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3.4; ctx.lineCap = 'round'
  ctx.beginPath(); ctx.moveTo(-7, 1); ctx.lineTo(-1, 7); ctx.lineTo(8, -6); ctx.stroke()
  ctx.restore()

  // 4) 虚线路径
  ctx.strokeStyle = 'rgba(90,110,140,.5)'; ctx.lineWidth = 1.5
  ctx.setLineDash([5, 5])
  ctx.beginPath(); ctx.moveTo(158, 118); ctx.quadraticCurveTo(196, 132, 224, 130); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(214, 40); ctx.quadraticCurveTo(204, 46, 190, 52); ctx.stroke()
  ctx.setLineDash([])

  // 5) 便签
  ctx.save(); ctx.translate(42, 146); ctx.rotate(.06)
  ctx.shadowColor = 'rgba(40,60,90,.2)'; ctx.shadowBlur = 5; ctx.shadowOffsetY = 2
  ctx.fillStyle = '#fff7cf'; ctx.fillRect(-28, -14, 56, 28)
  ctx.shadowColor = 'transparent'
  ctx.fillStyle = '#6b5a2a'
  ctx.font = '700 10px ' + F.hand
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.fillText('白边 + 投影', 0, 0)
  ctx.restore()
  ctx.fillStyle = 'rgba(60,80,105,.6)'
  ctx.font = '7px ' + F.mono
  ctx.textAlign = 'left'
  ctx.fillText('STICKER EXPLAINER', 16, 22)
}

/* ================================================================
   S8-V8 赛博朋克界面 —— HUD + 数据流 + 霓虹
   ================================================================ */
function v8() {
  const R = rng(88)
  ctx.fillStyle = '#05080f'; ctx.fillRect(0, 0, W, H)
  // 暗蓝底光
  const gl = ctx.createRadialGradient(160, 92, 6, 160, 92, 150)
  gl.addColorStop(0, 'rgba(0,140,180,.30)'); gl.addColorStop(1, 'rgba(0,0,0,0)')
  ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H)
  // 网格
  ctx.strokeStyle = 'rgba(0,229,255,.10)'; ctx.lineWidth = 1
  for (let x = 0; x < W; x += 18) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke() }
  for (let y = 0; y < H; y += 18) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke() }
  // 数据流列
  ctx.font = '7px ' + F.mono
  const hex = '0123456789ABCDEF'
  for (let col = 0; col < 8; col++) {
    const x = 10 + col * 41
    for (let r0 = 0; r0 < 7; r0++) {
      let s = ''
      for (let k = 0; k < 5; k++) s += hex[Math.floor(R() * 16)]
      ctx.fillStyle = `rgba(0,229,255,${0.07 + R() * 0.16})`
      ctx.fillText(s, x, 18 + r0 * 9 + col * 3)
    }
  }
  const cyan = '#00e5ff', mag = '#ff2e97'
  // 角标
  ctx.strokeStyle = cyan; ctx.lineWidth = 1.6
  const br = [[6, 6, 1, 1], [314, 6, -1, 1], [6, 174, 1, -1], [314, 174, -1, -1]]
  for (const [x, y, sx, sy] of br) {
    ctx.beginPath(); ctx.moveTo(x, y + 16 * sy); ctx.lineTo(x, y); ctx.lineTo(x + 16 * sx, y); ctx.stroke()
  }
  // 中央六边形面板
  const cx = 160, cy = 90
  const hexPts = r => {
    const p = []
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 6 + i * Math.PI / 3
      p.push([cx + Math.cos(a) * r * 1.12, cy + Math.sin(a) * r * 0.86])
    }
    return p
  }
  ctx.fillStyle = 'rgba(0,229,255,.05)'
  poly(hexPts(52), true); ctx.fill()
  ctx.strokeStyle = 'rgba(0,229,255,.65)'; ctx.lineWidth = 1.4
  poly(hexPts(52), true); ctx.stroke()

/* ================================================================
   S8-V9 拼贴剪贴 —— 牛皮纸 + 撕边 + 半调网点 + 胶带
   ================================================================ */
function v9() {
  const R = rng(97)
  ctx.fillStyle = '#c3ae90'; ctx.fillRect(0, 0, W, H)
  // 牛皮纸颗粒
  for (let i = 0; i < 500; i++) {
    ctx.fillStyle = `rgba(${R() > .5 ? '90,74,52' : '232,220,200'},${0.03 + R() * 0.07})`
    ctx.fillRect(R() * W, R() * H, R() * 2.4, R() * 2.4)
  }
  function torn(x, y, w, h) {
    const p = []
    for (let i = 0; i <= w; i += 7) p.push([x + i, y + (R() - .5) * 5])
    for (let i = 0; i <= h; i += 7) p.push([x + w + (R() - .5) * 5, y + i])
    for (let i = w; i >= 0; i -= 7) p.push([x + i, y + h + (R() - .5) * 5])
    for (let i = h; i >= 0; i -= 7) p.push([x + (R() - .5) * 5, y + i])
    return p
  }
  // 白色撕纸（大）
  ctx.save(); ctx.translate(112, 88); ctx.rotate(-.06)
  ctx.shadowColor = 'rgba(50,40,25,.4)'; ctx.shadowBlur = 7; ctx.shadowOffsetY = 3
  ctx.fillStyle = '#f4f0e6'
  poly(torn(-70, -56, 140, 112), true); ctx.fill()
  ctx.shadowColor = 'transparent'
  // 半调网点
  ctx.save(); ctx.clip()
  ctx.fillStyle = 'rgba(30,30,30,.55)'
  for (let y = -56; y < 56; y += 5) for (let x = -70; x < 70; x += 5) {
    const d = Math.min(1, (x + 70) / 140)

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'

  ctx.save(); ctx.translate(240, 66); ctx.rotate(.09)
  ctx.shadowColor = 'rgba(50,40,25,.35)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 3
  ctx.fillStyle = '#b12a20'
  poly(torn(-46, -30, 92, 60), true); ctx.fill()
  ctx.shadowColor = 'transparent'
  ctx.fillStyle = '#f7ece0'
  ctx.font = '400 13px ' + F.mono
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.fillText('COLLAGE', 0, -8)
  ctx.font = '700 10px ' + F.sans
  ctx.fillText('剪 贴', 0, 10)
  ctx.restore()

  // 报纸条
  ctx.save(); ctx.translate(244, 132); ctx.rotate(-.13)
  ctx.fillStyle = '#efe9dc'
  ctx.fillRect(-44, -13, 88, 26)
  ctx.fillStyle = 'rgba(30,30,30,.75)'
  for (let i = 0; i < 4; i++) ctx.fillRect(-40, -10 + i * 5.5, 62 - i * 6, 2)
  ctx.restore()

  // 胶带 1（左上）
  ctx.save(); ctx.translate(52, 34); ctx.rotate(-.32)
  ctx.fillStyle = 'rgba(226,213,178,.72)'
  ctx.fillRect(-40, -11, 80, 22)
  ctx.fillStyle = 'rgba(255,255,255,.28)'
  ctx.fillRect(-40, -11, 80, 5)
  ctx.strokeStyle = 'rgba(160,145,115,.35)'; ctx.lineWidth = 1
  for (let i = -38; i < 40; i += 6) { ctx.beginPath(); ctx.moveTo(i, -11); ctx.lineTo(i, 11); ctx.stroke() }
  ctx.restore()
  // 胶带 2（右下）
  ctx.save(); ctx.translate(272, 158); ctx.rotate(-.7)
  ctx.fillStyle = 'rgba(226,213,178,.7)'
  ctx.fillRect(-30, -9, 60, 18)
  ctx.restore()

  // 勒索信字母块
  const letters = [['拼', -8, '#f6f0e2', '#1a1a1a'], ['贴', 7, '#141414', '#f6f0e2'], ['报', 20, '#b12a20', '#fff']]
  letters.forEach(([ch, rot, bgc, fgc], i) => {
    ctx.save(); ctx.translate(34 + i * 26, 152); ctx.rotate(rot * .01)
    ctx.fillStyle = bgc; ctx.fillRect(-11, -11, 22, 22)
    ctx.fillStyle = fgc
    ctx.font = '700 14px ' + F.sans
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
    ctx.fillText(ch, 0, 1)
    ctx.restore()
  })
  ctx.fillStyle = 'rgba(60,48,32,.65)'
  ctx.font = '7px ' + F.mono
  ctx.textAlign = 'right'
  ctx.fillText('MAGAZINE CLIPPING / 1968', 306, 26)

  ctx.fillStyle = 'rgba(0,0,0,.5)'; rr(px, py, pw, ph, pr); ctx.fill()
  ctx.restore()
  ctx.save()
  rr(px, py, pw, ph, pr); ctx.clip()
  // 玻璃后的高饱和极光（模糊）
  ctx.globalCompositeOperation = 'lighter'
  ctx.filter = 'blur(9px)'
  const inner = [[96, 108, 78, '#2bf0b4', .85], [168, 66, 76, '#9b6dff', .7],

  for (const [x, y, r, col, a] of inner) {
    const gg = ctx.createRadialGradient(x, y, 2, x, y, r)
    gg.addColorStop(0, hexa(col, a)); gg.addColorStop(.55, hexa(col, a * .35)); gg.addColorStop(1, hexa(col, 0))
    ctx.fillStyle = gg; circle(x, y, r); ctx.fill()
  }
  ctx.filter = 'none'
  // 玻璃白纱 + 顶部高光
  ctx.fillStyle = 'rgba(240,255,252,.13)'; ctx.fillRect(px, py, pw, ph)
  const top = ctx.createLinearGradient(0, py, 0, py + 40)

  ctx.fillStyle = top; ctx.fillRect(px, py, pw, 40)
  ctx.globalCompositeOperation = 'source-over'
  ctx.restore()
  // 玻璃边框与内高光

  rr(px + 4.5, py + 4.5, pw - 9, ph - 9, pr - 4); ctx.stroke()
  ctx.fillStyle = 'rgba(255,255,255,.75)'
  rr(px + 20, py + 1.2, 72, 1.8, 1); ctx.fill()
  // 右上角小胶囊
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1
  rr(px + pw - 62, py + 12, 50, 16, 8); ctx.stroke()
  ctx.fillStyle = 'rgba(255,255,255,.8)'
  ctx.font = '7px ' + F.mono
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.fillText('BLUR 24px', px + pw - 37, py + 20)
  // 卡内文字
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'
  ctx.fillStyle = 'rgba(255,255,255,.97)'
  ctx.font = '700 27px ' + F.sans

  ctx.fillStyle = 'rgba(255,255,255,.55)'
  ctx.font = '7px ' + F.mono
  ctx.fillText('AURORA / GLASSMORPHISM', 18, 20)

  ctx.fillText('08', 304, 20)

    ctx.fillStyle = `rgba(255,255,255,${R() * .07})`
    ctx.fillRect(R() * W, R() * H, 1, 1)
  }
}
function hexa(hex, a) {
  const n = parseInt(hex.slice(1), 16)
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`
}

/* ================================================================
   S8-V13 像素 —— 4px 网格像素画 + 点阵字
   ================================================================ */
function v13() {
  const P = '#1a1c2c', D = '#333c57', M = '#566c86', B = '#29366f',
        L = '#3b5dc9', C = '#41a6f6', T = '#73eff7', Y = '#ffcd75',
        O = '#ef7d57', R = '#b13e53', G = '#38b764', WT = '#f4f4f4'
  const S = 4
  ctx.fillStyle = P; ctx.fillRect(0, 0, W, H)
  const R0 = rng(4242)
  // 天空分色带
  const bands = [[P, 0, 26], ['#232a52', 26, 28], [B, 54, 24], ['#35508f', 78, 18], ['#3b5dc9', 96, 16]]
  for (const [col, y, h] of bands) { ctx.fillStyle = col; ctx.fillRect(0, y, W, h) }
  // 像素星
  for (let i = 0; i < 34; i++) {
    const gx = Math.floor(R0() * 80) * S, gy = Math.floor(R0() * 22) * S
    ctx.fillStyle = R0() > .72 ? T : WT
    ctx.fillRect(gx, gy, S - 1, S - 1)

  const mx = 244, my = 34, mr = 17
  for (let y = -mr; y <= mr; y += S) for (let x = -mr; x <= mr; x += S) {
    if (x * x + y * y <= mr * mr) {

    for (let x = 0; x < W; x += S) {

  px(58, 104, 16, 8, R)

  px(54, 126, 4, 4, '#fff7cf')

  px(216, 114, 20, 12, G)

  }
  // 点阵字 PIXEL

}

/* ================================================================
   S8-V14 液态流动 —— 流体金属 + 波纹
   ================================================================ */
function v14() {
  const bg = ctx.createRadialGradient(150, 80, 10, 160, 100, 230)

    const g = ctx.createLinearGradient(-r * .9, -r, r * .9, r)
    g.addColorStop(0, '#f4faff'); g.addColorStop(.14, '#b9cddd')
    g.addColorStop(.30, '#1b222a'); g.addColorStop(.44, '#cfe0ec')
    g.addColorStop(.56, '#5c6b7a'); g.addColorStop(.68, '#0e1319')
    g.addColorStop(.82, '#a7bccc'); g.addColorStop(1, '#232b34')
    ctx.fillStyle = g; ctx.fillRect(-r * 2, -r * 2, r * 4, r * 4)
    // 左右暗边，做出圆柱感
    const ge = ctx.createLinearGradient(-r * 1.1, 0, r * 1.1, 0)
    ge.addColorStop(0, 'rgba(0,0,0,.5)'); ge.addColorStop(.3, 'rgba(0,0,0,0)')
    ge.addColorStop(.72, 'rgba(0,0,0,0)'); ge.addColorStop(1, 'rgba(0,0,0,.55)')
    ctx.fillStyle = ge; ctx.fillRect(-r * 2, -r * 2, r * 4, r * 4)
    // 主高光
    const hg = ctx.createRadialGradient(-r * .34, -r * .42, 1, -r * .34, -r * .42, r * .85)
    hg.addColorStop(0, 'rgba(255,255,255,.95)'); hg.addColorStop(.4, 'rgba(255,255,255,.14)'); hg.addColorStop(1, 'rgba(255,255,255,0)')
    ctx.fillStyle = hg; ctx.fillRect(-r * 2, -r * 2, r * 4, r * 4)
    ctx.restore()
    // 边缘
    ctx.strokeStyle = 'rgba(255,255,255,.72)'; ctx.lineWidth = 1.2
    poly(pts, true); ctx.stroke()
    ctx.restore()
  }

  // 主液滴
  chrome(132, 92, 52, .92, 1.7)
  // 卫星液滴
  chrome(214, 60, 17, 1, 4.2)
  chrome(226, 122, 11, 1, 2.1)
  chrome(76, 56, 9, 1, 5.3)
  // 拉丝高光
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2.2; ctx.lineCap = 'round'
  ctx.beginPath(); ctx.moveTo(104, 66); ctx.quadraticCurveTo(126, 56, 152, 66); ctx.stroke()
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.2
  ctx.beginPath(); ctx.moveTo(98, 100); ctx.quadraticCurveTo(120, 112, 146, 104); ctx.stroke()
  // 虹彩边
  ctx.strokeStyle = 'rgba(150,130,255,.28)'; ctx.lineWidth = 1.4
  ctx.beginPath(); ctx.arc(130, 92, 49, -0.5, 0.7); ctx.stroke()
  ctx.strokeStyle = 'rgba(110,255,235,.22)'
  ctx.beginPath(); ctx.arc(134, 90, 48, 1.7, 2.7); ctx.stroke()

  // 波纹
  for (let i = 1; i <= 6; i++) {
    ctx.strokeStyle = `rgba(200,225,245,${0.26 - i * 0.035})`
    ctx.lineWidth = 1
    ctx.beginPath(); ctx.ellipse(132, 150, 16 + i * 14, 3 + i * 2.4, 0, 0, Math.PI * 2); ctx.stroke()

/* ================================================================

function v15() {

  ctx.fillStyle = 'rgba(255,255,255,.22)'

  ctx.restore()
  // 大字：综艺

    }
    ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.strokeText(text, 0, 0)
    ctx.fillStyle = fill; ctx.fillText(text, 0, 0)
    // 顶部高光

    g.addColorStop(0, 'rgba(255,255,255,.85)'); g.addColorStop(.45, 'rgba(255,255,255,0)')
    ctx.fillStyle = g; ctx.fillText(text, 0, 0)

  ctx.font = '900 26px ' + F.sans

  ctx.lineJoin = 'round'

    ctx.quadraticCurveTo(x + r * .16, y + r * .16, x, y + r)
    ctx.quadraticCurveTo(x - r * .16, y + r * .16, x - r, y)
    ctx.quadraticCurveTo(x - r * .16, y - r * .16, x, y - r)

  }

  spark(58, 52, 10, '#ffd93d')
  spark(276, 108, 8, '#ffffff')
  spark(38, 120, 7, '#ffffff')
  // 感叹号气泡

  ctx.fillStyle = '#fff'; circle(0, 0, 17); ctx.fill()
  ctx.fillStyle = '#e01e6e'
  ctx.font = '900 20px ' + F.sans

  ctx.fillRect(0, 160, W, 20)

  ctx.textAlign = 'right'
