<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  canvas{display:block;width:320px;height:180px}
</style>
</head>
<body>
<canvas id="c" width="320" height="180"></canvas>
<script>
const W = 320, H = 180
const c = document.getElementById('c')
const ctx = c.getContext('2d')
const id = new URLSearchParams(location.search).get('id') || 'S9-X18'

const F = {
  sans: '"Microsoft YaHei","PingFang SC",sans-serif',
  serif: '"SimSun","Songti SC",serif',
  hand: '"KaiTi","STKaiti",serif',
  mono: '"Consolas","Courier New",monospace',
}

/* ---------------- 工具 ---------------- */
function rng(seed) {
  let s = seed >>> 0
  return function () {
    s = (s + 0x6D2B79F5) >>> 0
    let t = Math.imul(s ^ (s >>> 15), 1 | s)
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
}
function rr(x, y, w, h, r) {
  ctx.beginPath()
  ctx.moveTo(x + r, y)
  ctx.arcTo(x + w, y, x + w, y + h, r)
  ctx.arcTo(x + w, y + h, x, y + h, r)
  ctx.arcTo(x, y + h, x, y, r)
  ctx.arcTo(x, y, x + w, y, r)
  ctx.closePath()
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2) }
function poly(pts, close) {
  ctx.beginPath()
  for (let i = 0; i < pts.length; i++) i ? ctx.lineTo(pts[i][0], pts[i][1]) : ctx.moveTo(pts[i][0], pts[i][1])
  if (close) ctx.closePath()
}
function starPts(cx, cy, R, spikes, inner, rot) {
  const pts = []
  for (let i = 0; i < spikes * 2; i++) {
    const rad = i % 2 ? R * inner : R
    const a = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2 + (rot || 0)
    pts.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad])
  }
  return pts
}
function halftone(x, y, w, h, step, r, color) {
  ctx.save(); ctx.fillStyle = color
  let row = 0
  for (let yy = y; yy < y + h; yy += step, row++) {
    for (let xx = x + (row % 2 ? step / 2 : 0); xx < x + w; xx += step) {
      ctx.beginPath(); ctx.arc(xx, yy, r, 0, 6.2832); ctx.fill()
    }
  }
  ctx.restore()
}
function grain(n, seed, alpha) {
  const R = rng(seed); ctx.save()
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = 'rgba(255,255,255,' + (R() * alpha).toFixed(3) + ')'
    ctx.fillRect(R() * W, R() * H, 1, 1)
  }
  ctx.restore()
}
function dashArrow(x1, y1, x2, y2, color, lw) {
  ctx.save()
  ctx.strokeStyle = color; ctx.lineWidth = lw || 1
  ctx.setLineDash([4, 3])
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke()
  ctx.setLineDash([])
  const a = Math.atan2(y2 - y1, x2 - x1)
  ctx.beginPath()
  ctx.moveTo(x2, y2); ctx.lineTo(x2 - Math.cos(a - .42) * 6, y2 - Math.sin(a - .42) * 6)
  ctx.moveTo(x2, y2); ctx.lineTo(x2 - Math.cos(a + .42) * 6, y2 - Math.sin(a + .42) * 6)
  ctx.stroke(); ctx.restore()
}

/* ================================================================
   S9-X18 漫画书 —— 分格 / 对话气泡 / 网点
   ================================================================ */
function comic() {
  const R = rng(1801)
  ctx.fillStyle = '#f8f1dc'; ctx.fillRect(0, 0, W, H)
  halftone(0, 0, W, H, 5.5, 1.05, 'rgba(186,140,50,.22)')

  /* ---- 左大格：动作爆炸 ---- */
  ctx.fillStyle = '#ffffff'; ctx.fillRect(8, 8, 192, 164)
  ctx.save(); ctx.beginPath(); ctx.rect(8, 8, 192, 164); ctx.clip()
  ctx.strokeStyle = 'rgba(20,18,16,.5)'; ctx.lineWidth = 1.1
  for (let i = 0; i < 28; i++) {
    const a = i / 28 * Math.PI * 2 + .15
    ctx.beginPath()
    ctx.moveTo(104 + Math.cos(a) * 44, 86 + Math.sin(a) * 44)
    ctx.lineTo(104 + Math.cos(a) * 240, 86 + Math.sin(a) * 240)
    ctx.stroke()
  }
  halftone(8, 116, 200, 172, 5.4, 1.7, 'rgba(200,52,36,.42)')
  halftone(8, 8, 200, 62, 6, 1.4, 'rgba(30,90,170,.20)')
  poly(starPts(104, 84, 58, 15, .6, .12), true)
  ctx.fillStyle = '#ffd23f'; ctx.fill()
  ctx.strokeStyle = '#141414'; ctx.lineWidth = 2.6; ctx.stroke()
  ctx.save(); ctx.translate(104, 88); ctx.rotate(-.09)
  ctx.fillStyle = '#141414'; ctx.font = '900 32px ' + F.sans
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.fillText('砰!', 0, 0)
  ctx.restore()
  /* 旁白框 */
  ctx.fillStyle = '#fff'; ctx.fillRect(16, 146, 76, 18)
  ctx.strokeStyle = '#141414'; ctx.lineWidth = 2; ctx.strokeRect(16, 146, 76, 18)
  ctx.fillStyle = '#141414'; ctx.font = '700 9px ' + F.sans
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'
  ctx.fillText('第 12 话', 23, 159)
  ctx.restore()
  ctx.strokeStyle = '#141414'; ctx.lineWidth = 3; ctx.strokeRect(8, 8, 192, 164)

  /* ---- 右上格：对白气泡 ---- */
  ctx.fillStyle = '#ffffff'; ctx.fillRect(208, 8, 104, 76)
  halftone(208, 8, 104, 76, 5, 1.25, 'rgba(30,90,170,.26)')
  ctx.beginPath(); ctx.ellipse(257, 36, 36, 22, 0, 0, 6.2832)
  ctx.fillStyle = '#ffffff'; ctx.fill()
  ctx.beginPath(); ctx.moveTo(240, 54); ctx.lineTo(226, 72); ctx.lineTo(252, 57); ctx.closePath()
  ctx.fillStyle = '#ffffff'; ctx.fill()
  ctx.strokeStyle = '#141414'; ctx.lineWidth = 2
  ctx.beginPath(); ctx.ellipse(257, 36, 36, 22, 0, 0, 6.2832); ctx.stroke()
  ctx.fillStyle = '#141414'; ctx.font = '700 12px ' + F.sans
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.fillText('你确定？', 257, 37)
  ctx.strokeStyle = '#141414'; ctx.lineWidth = 3; ctx.strokeRect(208, 8, 104, 76)

  /* ---- 右下格：黑底待续 ---- */
  ctx.fillStyle = '#17171a'; ctx.fillRect(208, 84, 104, 88)
  poly([[246, 90], [228, 124], [246, 124], [238, 146], [266, 110], [248, 110]], true)
  ctx.fillStyle = '#ffe14d'; ctx.fill()
  ctx.fillStyle = '#ffffff'; ctx.font = '700 13px ' + F.sans
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'
  ctx.fillText('待续…', 256, 162)
  ctx.strokeStyle = '#141414'; ctx.lineWidth = 3; ctx.strokeRect(208, 84, 104, 88)
}

/* ================================================================
   S9-X19 纪录片 —— 采访画框 / 字幕条 / 时间码
   ================================================================ */
function docu() {
  const R = rng(1902)
  const g = ctx.createLinearGradient(0, 0, W, H)
  g.addColorStop(0, '#2c2218'); g.addColorStop(.55, '#161110'); g.addColorStop(1, '#0a0806')
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H)
  /* 背景虚化暖光 */
  for (let i = 0; i < 16; i++) {
    const x = R() * W, y = 26 + R() * 120, r = 8 + R() * 26
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r)
    rg.addColorStop(0, 'rgba(255,188,110,' + (.05 + R() * .07).toFixed(3) + ')')
    rg.addColorStop(1, 'rgba(255,180,100,0)')
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill()
  }
  /* 人物身后暖光分离 */
  const sep = ctx.createRadialGradient(258, 62, 6, 258, 62, 92)
  sep.addColorStop(0, 'rgba(255,186,112,.22)'); sep.addColorStop(1, 'rgba(255,186,112,0)')
  ctx.fillStyle = sep; ctx.fillRect(0, 0, W, H)
  /* 人物剪影（比背景亮一档，才看得出形） */
  ctx.beginPath(); ctx.moveTo(188, 168)
  ctx.quadraticCurveTo(198, 118, 232, 103)
  ctx.lineTo(298, 103)
  ctx.quadraticCurveTo(322, 124, 322, 168)
  ctx.closePath()
  ctx.fillStyle = '#2b2218'; ctx.fill()
  /* 脖子 + 头 */
  ctx.fillStyle = '#241b14'
  ctx.fillRect(240, 92, 30, 16)
  ctx.beginPath(); ctx.ellipse(255, 70, 25, 28, 0, 0, 6.2832); ctx.fill()
  /* 头发 */
  ctx.beginPath(); ctx.ellipse(255, 52, 25, 15, 0, Math.PI, 0); ctx.fill()
  /* 左侧轮廓光 */
  ctx.save()
  ctx.beginPath(); ctx.ellipse(255, 70, 25, 28, 0, 0, 6.2832); ctx.clip()
  const rim = ctx.createLinearGradient(228, 56, 262, 100)
  rim.addColorStop(0, 'rgba(255,208,146,.55)'); rim.addColorStop(1, 'rgba(255,208,146,0)')
  ctx.fillStyle = rim; ctx.fillRect(226, 38, 40, 64)
  ctx.restore()
  ctx.beginPath(); ctx.moveTo(232, 103)
  ctx.quadraticCurveTo(208, 130, 202, 168)
  ctx.strokeStyle = 'rgba(255,206,142,.42)'; ctx.lineWidth = 2.4; ctx.stroke()
  /* 采访麦 */
  ctx.strokeStyle = 'rgba(14,11,9,.98)'; ctx.lineWidth = 4
  ctx.beginPath(); ctx.moveTo(138, 182); ctx.lineTo(199, 116); ctx.stroke()
  const mg = ctx.createRadialGradient(202, 104, 2, 206, 110, 13)
  mg.addColorStop(0, 'rgba(104,96,84,1)'); mg.addColorStop(1, 'rgba(26,22,18,1)')
  ctx.fillStyle = mg; circle(206, 110, 11); ctx.fill()
  ctx.strokeStyle = 'rgba(255,200,150,.22)'; ctx.lineWidth = 1; circle(206, 110, 11); ctx.stroke()
  ctx.fillStyle = 'rgba(255,240,220,.16)'
  for (let i = 0; i < 30; i++) {
    const a = R() * 6.2832, rd = 3 + R() * 7
    circle(206 + Math.cos(a) * rd, 110 + Math.sin(a) * rd, 1); ctx.fill()
  }
  /* 暗角 */
  const vg = ctx.createRadialGradient(200, 90, 40, 200, 90, 200)
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.75)')
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H)
  /* 遮幅 */
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, 15); ctx.fillRect(0, 165, W, 15)
  /* 时间码 */
  ctx.fillStyle = 'rgba(232,227,216,.85)'; ctx.font = '10px ' + F.mono
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'
  ctx.fillText('00:12:47:03', 12, 29)
  circle(98, 25.5, 3); ctx.fillStyle = '#d0332b'; ctx.fill()
  ctx.fillStyle = 'rgba(220,215,205,.8)'; ctx.font = '9px ' + F.mono
  ctx.fillText('REC', 106, 29)
  /* 字幕条 */
  ctx.fillStyle = 'rgba(0,0,0,.52)'; ctx.fillRect(26, 133, 268, 29)
  ctx.fillStyle = '#f4efe4'; ctx.font = '12px ' + F.sans
  ctx.textAlign = 'center'; ctx.fillText('“那年冬天，我们几乎是空手出发。”', 160, 152)
  /* 左下角受访者标签 */
  ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(190,182,170,.55)'
  ctx.font = '8px ' + F.sans; ctx.fillText('受访者 ｜ 老船工 · 78 岁', 12, 176)
  grain(320, 1903, .05)
}

/* ================================================================
   S9-X20 博物馆展览 —— 展签 / 文物剪影 / 射灯
   ================================================================ */
function museum() {
  const g = ctx.createLinearGradient(0, 0, 0, H)
  g.addColorStop(0, '#2c2823'); g.addColorStop(.7, '#151210'); g.addColorStop(1, '#0a0908')
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H)
  /* 左后方暗色陶罐（虚） */
  ctx.fillStyle = 'rgba(58,48,38,.85)'
  ctx.beginPath(); ctx.ellipse(40, 128, 17, 24, 0, 0, 6.2832); ctx.fill()
  ctx.fillRect(36, 100, 8, 12)
  /* 射灯光锥 */
  const lg = ctx.createLinearGradient(0, 0, 0, 158)
  lg.addColorStop(0, 'rgba(255,242,206,.30)'); lg.addColorStop(1, 'rgba(255,236,190,.04)')
  poly([[150, -8], [92, 152], [214, 152], [172, -8]], true)
  ctx.fillStyle = lg; ctx.fill()
  /* 地面光斑 */
  const pool = ctx.createRadialGradient(153, 152, 4, 153, 152, 74)
  pool.addColorStop(0, 'rgba(255,238,200,.24)'); pool.addColorStop(1, 'rgba(255,238,200,0)')
  ctx.fillStyle = pool
  ctx.beginPath(); ctx.ellipse(153, 152, 74, 22, 0, 0, 6.2832); ctx.fill()
  /* 展台（薄石板） */
  ctx.fillStyle = '#0d0b09'; ctx.fillRect(96, 150, 112, 30)
  ctx.fillStyle = 'rgba(255,240,210,.16)'; ctx.fillRect(96, 150, 112, 2.5)
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(96, 152.5, 112, 4)
  /* 青铜方鼎 */
  const bronze = ctx.createLinearGradient(118, 58, 196, 126)
  bronze.addColorStop(0, '#c99a55'); bronze.addColorStop(.45, '#8b6735'); bronze.addColorStop(1, '#4d3318')
  /* 口沿 */
  ctx.fillStyle = '#b0803f'; ctx.fillRect(116, 60, 84, 12)
  ctx.fillStyle = 'rgba(255,230,180,.6)'; ctx.fillRect(116, 60, 84, 3)
  /* 双耳 */
  ctx.strokeStyle = '#a87c42'; ctx.lineWidth = 4
  ctx.beginPath(); ctx.moveTo(124, 60); ctx.lineTo(124, 46); ctx.lineTo(136, 46); ctx.lineTo(136, 60); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(180, 60); ctx.lineTo(180, 46); ctx.lineTo(192, 46); ctx.lineTo(192, 60); ctx.stroke()
  /* 腹 */
  poly([[120, 72], [196, 72], [184, 124], [132, 124]], true)
  ctx.fillStyle = bronze; ctx.fill()
  ctx.strokeStyle = 'rgba(30,18,6,.55)'; ctx.lineWidth = 1; ctx.stroke()
  /* 饕餮纹带 */
  ctx.fillStyle = 'rgba(36,22,8,.5)'; ctx.fillRect(124, 86, 68, 13)
  ctx.fillStyle = 'rgba(228,194,128,.85)'
  circle(146, 92, 3.2); ctx.fill()
  circle(170, 92, 3.2); ctx.fill()
  for (let i = 0; i < 5; i++) { ctx.fillRect(129 + i * 14, 96, 5, 1.6) }
  /* 三足 */
  ctx.fillStyle = '#63431f'
  poly([[132, 122], [142, 122], [139, 150], [129, 150]], true); ctx.fill()
  poly([[174, 122], [184, 122], [187, 150], [177, 150]], true); ctx.fill()
  poly([[153, 122], [163, 122], [162, 146], [154, 146]], true); ctx.fill()
  /* 足端 */
  ctx.fillStyle = '#7d5626'
  ctx.fillRect(128, 147, 12, 3); ctx.fillRect(176, 147, 12, 3)
  /* 腹侧高光 */
  ctx.strokeStyle = 'rgba(255,232,182,.42)'; ctx.lineWidth = 1.2
  ctx.beginPath(); ctx.moveTo(126, 76); ctx.lineTo(134, 120); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(190, 76); ctx.lineTo(184, 118); ctx.stroke()
  /* 展签 */
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(16, 136, 88, 32)
  ctx.fillStyle = '#efe7d6'; ctx.fillRect(14, 134, 88, 32)
  ctx.fillStyle = '#2a251f'; ctx.font = '700 11px ' + F.serif
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'
  ctx.fillText('青铜方鼎', 20, 147)
  ctx.fillStyle = '#6b6357'; ctx.font = '7px ' + F.sans
  ctx.fillText('西周 · 公元前十世纪', 20, 156)
  ctx.fillStyle = '#8a7f70'; ctx.font = '6.5px ' + F.mono
  ctx.fillText('NO. B-107', 20, 163)
  grain(260, 2003, .035)
}

/* ================================================================
   S9-X21 突发新闻 —— 红色 BREAKING 条 / 演播室
   ================================================================ */
function breaking() {
  const R = rng(2104)
  const g = ctx.createLinearGradient(0, 0, 0, H)
  g.addColorStop(0, '#0f3f7a'); g.addColorStop(.6, '#0a2547'); g.addColorStop(1, '#061528')
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H)
  /* 演播室灯带 */
  ctx.strokeStyle = 'rgba(90,170,255,.20)'; ctx.lineWidth = 12
  ctx.beginPath(); ctx.arc(244, 100, 88, Math.PI * .88, Math.PI * 1.92); ctx.stroke()
  ctx.strokeStyle = 'rgba(140,210,255,.12)'; ctx.lineWidth = 3
  ctx.beginPath(); ctx.arc(244, 100, 70, Math.PI * .88, Math.PI * 1.92); ctx.stroke()
  /* 城市天际线 */
  for (let i = 0; i < 17; i++) {
    const w = 12 + R() * 15, h = 14 + R() * 46
    ctx.fillStyle = 'rgba(6,26,48,.95)'
    ctx.fillRect(i * 20 - 6, 158 - h, w, h)
  }
  for (let i = 0; i < 80; i++) {
    ctx.fillStyle = 'rgba(120,200,255,' + (.1 + R() * .45).toFixed(2) + ')'
    ctx.fillRect(R() * W, 64 + R() * 92, 1.6, 1.6)
  }
  /* 地球线框 */
  ctx.save(); ctx.translate(262, 84)
  ctx.strokeStyle = 'rgba(120,190,255,.32)'; ctx.lineWidth = 1
  circle(0, 0, 32); ctx.stroke()
  for (let i = 1; i < 4; i++) {
    ctx.beginPath(); ctx.ellipse(0, 0, 32 * i / 3.2, 32, 0, 0, 6.2832); ctx.stroke()
  }
  for (let i = -2; i <= 2; i++) {
    const y = i * 13, rx = Math.sqrt(Math.max(0, 1024 - y * y))
    ctx.beginPath(); ctx.ellipse(0, y, rx, 3.4, 0, 0, 6.2832); ctx.stroke()
  }
  ctx.restore()
  /* BREAKING 条 */
  poly([[0, 14], [246, 14], [228, 50], [0, 50]], true)
  ctx.fillStyle = '#d0021b'; ctx.fill()
  ctx.fillStyle = '#ffffff'; ctx.font = '900 19px ' + F.sans
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'
  ctx.fillText('BREAKING', 15, 32)
  /* 中文小标 */
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 50, 128, 15)
  ctx.fillStyle = '#c0021a'; ctx.font = '700 9px ' + F.sans
  ctx.textBaseline = 'middle'; ctx.fillText('本台最新消息 · 直播中', 8, 58)
  /* 右上角台标 */
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(276, 62, 36, 16)
  ctx.fillStyle = '#cfe4ff'; ctx.font = '700 8px ' + F.sans
  ctx.textAlign = 'center'; ctx.fillText('NEWS24', 294, 70)
  /* 底部行情条 */
  ctx.fillStyle = '#d0021b'; ctx.fillRect(0, 156, W, 24)
  ctx.fillStyle = '#ffffff'; ctx.font = '700 11px ' + F.sans
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'
  ctx.fillText('突发 ｜ 强降雨致多条道路中断 · 救援正在进行', 10, 168)
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0, 156, W, 1.5)
}

/* ================================================================
   S9-X22 侦探线索板 —— 软木板 / 照片 / 红线 / 图钉
   ================================================================ */
function clueboard() {
  const R = rng(2205)
  ctx.fillStyle = '#b9883f'; ctx.fillRect(0, 0, W, H)
  for (let i = 0; i < 2800; i++) {
    const a = (.05 + R() * .13).toFixed(2)
    ctx.fillStyle = R() > .5 ? 'rgba(118,78,30,' + a + ')' : 'rgba(232,192,132,' + a + ')'
    ctx.fillRect(R() * W, R() * H, 1.7, 1.7)
  }
  for (let i = 0; i < 10; i++) {
    const x = R() * W, y = R() * H, r = 12 + R() * 30
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r)
    rg.addColorStop(0, 'rgba(90,58,18,.12)'); rg.addColorStop(1, 'rgba(90,58,18,0)')
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill()
  }
  /* 木框 */
  ctx.strokeStyle = '#4a2f16'; ctx.lineWidth = 14; ctx.strokeRect(0, 0, W, H)
  ctx.strokeStyle = 'rgba(255,222,170,.16)'; ctx.lineWidth = 2; ctx.strokeRect(8, 8, W - 16, H - 16)

  function photo(x, y, w, h, rot, painter, note) {
    ctx.save()
    ctx.translate(x + w / 2, y + h / 2); ctx.rotate(rot)
    ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 7; ctx.shadowOffsetY = 3
    ctx.fillStyle = '#f2ece0'; ctx.fillRect(-w / 2, -h / 2, w, h)
    ctx.shadowColor = 'transparent'
    ctx.save()
    ctx.beginPath(); ctx.rect(-w / 2 + 5, -h / 2 + 5, w - 10, h - 17); ctx.clip()
    painter(-w / 2 + 5, -h / 2 + 5, w - 10, h - 17)
    ctx.restore()
    if (note) {
      ctx.fillStyle = 'rgba(58,48,38,.55)'; ctx.font = '6px ' + F.hand
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'
      ctx.fillText(note, 0, h / 2 - 4)
    }
    ctx.restore()
  }
  /* 照片1：男人剪影 */
  photo(30, 26, 64, 74, -.055, function (x, y, w, h) {
    ctx.fillStyle = '#3b3a36'; ctx.fillRect(x, y, w, h)
    ctx.fillStyle = '#14140f'
    ctx.beginPath(); ctx.arc(x + w / 2, y + h * .38, 13, 0, 6.2832); ctx.fill()
    ctx.beginPath(); ctx.ellipse(x + w / 2, y + h + 4, 24, 26, 0, 0, 6.2832); ctx.fill()
    ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1
    ctx.beginPath(); ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w / 2, y + h); ctx.stroke()
  }, '嫌疑人 A')
  /* 照片2：街角监控 */
