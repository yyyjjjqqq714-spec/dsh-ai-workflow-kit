<!doctype html>
<html lang="zh">
<head>

<body>
<canvas id="c" width="320" height="180"></canvas>
<script>
const W = 320, H = 180
const c = document.getElementById('c')
const ctx = c.getContext('2d')
const id = new URLSearchParams(location.search).get('id') || 'S3-K1'

const F = {
  sans: '"Microsoft YaHei",sans-serif',
  serif: '"SimSun",serif',
  hand: '"KaiTi",serif',
  mono: '"Consolas",monospace',
}

let _s = 20261104
function rnd(){ _s = (_s * 1664525 + 1013904223) >>> 0; return _s / 4294967296 }

function rr(x, y, w, h, r) {
  ctx.beginPath()
  ctx.moveTo(x + r, y)
  ctx.arcTo(x + w, y, x + w, y + h, r)
  ctx.arcTo(x + w, y + h, x, y + h, r)
  ctx.arcTo(x, y + h, x, y, r)
  ctx.arcTo(x, y, x + w, y, r)
  ctx.closePath()
}
function circ(x, y, r, fill) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill()
}
function ell(x, y, rx, ry, rot, fill) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill()
}
function line(x1, y1, x2, y2, col, w) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2)
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke()
}
function poly(pts, fill) {
  ctx.beginPath()
  pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill()
}
function star(x, y, r, n, fill) {
  ctx.beginPath()
  for (let i = 0; i < n * 2; i++) {
    const a = -Math.PI / 2 + i * Math.PI / n
    const rad = i % 2 ? r * 0.42 : r
    const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)
  }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill()
}
function sparkle(x, y, r, fill) {
  ctx.beginPath()
  ctx.moveTo(x, y - r)
  ctx.quadraticCurveTo(x + r * .18, y - r * .18, x + r, y)
  ctx.quadraticCurveTo(x + r * .18, y + r * .18, x, y + r)
  ctx.quadraticCurveTo(x - r * .18, y + r * .18, x - r, y)
  ctx.quadraticCurveTo(x - r * .18, y - r * .18, x, y - r)
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill()
}
function dots(x, y, w, h, step, rad, col) {
  ctx.fillStyle = col
  for (let yy = y; yy < y + h; yy += step)
    for (let xx = x; xx < x + w; xx += step) {
      ctx.beginPath(); ctx.arc(xx + step / 2, yy + step / 2, rad, 0, Math.PI * 2); ctx.fill()
    }
}
function heart(x, y, s, fill) {
  ctx.beginPath()
  ctx.moveTo(x, y + s * .82)
  ctx.bezierCurveTo(x - s * 1.1, y - s * .1, x - s * .42, y - s * .95, x, y - s * .3)
  ctx.bezierCurveTo(x + s * .42, y - s * .95, x + s * 1.1, y - s * .1, x, y + s * .82)
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill()
}
function grain(n, a) {
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = `rgba(0,0,0,${a * (0.3 + rnd())})`
    ctx.fillRect(rnd() * W, rnd() * H, 1.2, 1.2)
  }
}

/* ================= S3-K1 扁平矢量：无描边色块 + 几何人 ================= */
function k1() {
  ctx.fillStyle = '#f4efe4'; ctx.fillRect(0, 0, W, H)
  ctx.fillStyle = '#1f6f78'; ctx.fillRect(198, 0, 122, 180)
  circ(258, 48, 40, '#f2b03d')
  ctx.fillStyle = '#e2603f'; ctx.fillRect(0, 146, 198, 34)

  // 右侧白色卡片（无描边）
  ctx.save(); ctx.translate(226, 90); ctx.rotate(-0.05)
  ctx.fillStyle = '#ffffff'; rr(0, 0, 68, 46, 7); ctx.fill()
  ctx.fillStyle = '#1f6f78'; ctx.fillRect(10, 11, 28, 5)
  ctx.fillStyle = '#cfdcd8'; ctx.fillRect(10, 23, 46, 4); ctx.fillRect(10, 32, 34, 4)
  ctx.fillStyle = '#e2603f'; circ(58, 34, 5, '#e2603f')
  ctx.restore()

  // 人物
  ctx.fillStyle = '#1a2b3d'
  rr(86, 124, 13, 24, 4); ctx.fill()
  rr(101, 124, 13, 24, 4); ctx.fill()
  ctx.fillStyle = '#22384f'; rr(80, 82, 40, 48, 13); ctx.fill()
  ctx.strokeStyle = '#22384f'; ctx.lineWidth = 10; ctx.lineCap = 'round'
  ctx.beginPath(); ctx.moveTo(84, 94); ctx.lineTo(64, 114); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(116, 94); ctx.lineTo(138, 106); ctx.stroke()
  circ(62, 116, 6, '#f6c7a1'); circ(140, 108, 6, '#f6c7a1')
  circ(100, 68, 18, '#f6c7a1')
  ctx.fillStyle = '#22384f'
  ctx.beginPath(); ctx.arc(100, 67, 18.5, Math.PI, 0); ctx.fill()
  ctx.fillStyle = '#3a2a26'
  circ(93.5, 70, 2, '#3a2a26'); circ(106.5, 70, 2, '#3a2a26')
  ctx.strokeStyle = '#b06a52'; ctx.lineWidth = 1.6
  ctx.beginPath(); ctx.arc(100, 74, 4, 0.25, Math.PI - 0.25); ctx.stroke()
}

/* ================= S3-K2 Q版：大头小身圆润 ================= */
function k2() {
  ctx.fillStyle = '#fdf1e6'; ctx.fillRect(0, 0, W, H)
  ctx.globalAlpha = 0.55; circ(156, 100, 100, '#ffe3cf'); ctx.globalAlpha = 1

  // 小短腿
  ctx.fillStyle = '#f0b48a'
  rr(134, 142, 14, 22, 7); ctx.fill()
  rr(158, 142, 14, 22, 7); ctx.fill()
  // 小身体
  ctx.fillStyle = '#7fb6d9'; rr(130, 110, 44, 38, 15); ctx.fill()
  ctx.strokeStyle = '#5d97bd'; ctx.lineWidth = 4; ctx.lineCap = 'round'
  ctx.beginPath(); ctx.moveTo(138, 114); ctx.lineTo(144, 126); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(166, 114); ctx.lineTo(160, 126); ctx.stroke()
  // 抬起的小手臂
  ctx.save(); ctx.translate(126, 116); ctx.rotate(-0.55)
  ctx.fillStyle = '#ffddc2'; rr(-7, 0, 14, 30, 7); ctx.fill()
  circ(0, 32, 7, '#ffddc2'); ctx.restore()
  ctx.save(); ctx.translate(178, 116); ctx.rotate(0.55)
  ctx.fillStyle = '#ffddc2'; rr(-7, 0, 14, 30, 7); ctx.fill()
  circ(0, 32, 7, '#ffddc2'); ctx.restore()

  // 脖子
  ctx.fillStyle = '#ffddc2'; ctx.fillRect(144, 92, 16, 22)
  // 大脑袋（缩小并上移，露出小身体）
  ctx.save()
  ctx.translate(0, -12); ctx.translate(152, 72); ctx.scale(0.86, 0.86); ctx.translate(-152, -72)
  circ(110, 82, 8, '#ffddc2'); circ(194, 82, 8, '#ffddc2')
  circ(152, 74, 43, '#ffddc2')
  ctx.fillStyle = '#6b4530'
  ctx.beginPath(); ctx.arc(152, 72, 44, Math.PI, 0); ctx.fill()
  ctx.beginPath(); ctx.moveTo(110, 78); ctx.quadraticCurveTo(104, 100, 116, 112)
  ctx.quadraticCurveTo(110, 92, 118, 80); ctx.closePath(); ctx.fill()
  ctx.beginPath(); ctx.moveTo(194, 78); ctx.quadraticCurveTo(200, 100, 188, 112)
  ctx.quadraticCurveTo(194, 92, 186, 80); ctx.closePath(); ctx.fill()
  // 呆毛
  ctx.strokeStyle = '#6b4530'; ctx.lineWidth = 5; ctx.lineCap = 'round'
  ctx.beginPath(); ctx.moveTo(152, 31); ctx.quadraticCurveTo(160, 16, 170, 22); ctx.stroke()

  // 大眼睛
  ell(137, 80, 12, 14, 0, '#ffffff')
  ell(167, 80, 12, 14, 0, '#ffffff')
  circ(138, 82, 7.5, '#3a2a24'); circ(166, 82, 7.5, '#3a2a24')
  circ(135.5, 78, 3, '#ffffff'); circ(163.5, 78, 3, '#ffffff')
  ctx.fillStyle = '#6b4530'
  ctx.fillRect(127, 62, 20, 2.6); ctx.fillRect(157, 62, 20, 2.6)
  // 腮红 + 嘴
  ctx.globalAlpha = 0.55
  ell(120, 96, 10, 6, 0, '#f28b9b'); ell(184, 96, 10, 6, 0, '#f28b9b')
  ctx.globalAlpha = 1
  ctx.beginPath(); ctx.ellipse(152, 102, 9, 7.5, 0, 0, Math.PI); ctx.fillStyle = '#7a3b3b'; ctx.fill()
  ell(152, 107, 5, 3, 0, '#f08a8a')
  ctx.restore()
  // 漂浮爱心
  heart(246, 44, 10, '#f27a8d')
  star(276, 120, 9, 5, '#ffd25e')
}

/* ================= S3-K3 卡哇伊：粉彩 + 星星 + 腮红 ================= */
function k3() {
  ctx.fillStyle = '#ffd6e6'; ctx.fillRect(0, 0, W, H)
  ctx.fillStyle = 'rgba(255,255,255,.45)'
  for (let row = 0; row < 7; row++)
    for (let col = 0; col < 12; col++) {
      const x = col * 28 + (row % 2 ? 14 : 0), y = row * 28 + 8
      ctx.beginPath(); ctx.arc(x, y, 3.2, 0, Math.PI * 2); ctx.fill()
    }

  // 猫耳
  poly([[116, 74], [128, 40], [152, 62]], '#fff8f3')
  poly([[204, 74], [192, 40], [168, 62]], '#fff8f3')
  poly([[127, 68], [132, 50], [144, 62]], '#ffb3c8')
  poly([[193, 68], [188, 50], [176, 62]], '#ffb3c8')

  // 大脸
  circ(160, 102, 56, '#fff8f3')

  // 闭眼笑
  ctx.strokeStyle = '#5c4650'; ctx.lineWidth = 5; ctx.lineCap = 'round'
  ctx.beginPath(); ctx.moveTo(128, 100); ctx.quadraticCurveTo(140, 88, 152, 100); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(168, 100); ctx.quadraticCurveTo(180, 88, 192, 100); ctx.stroke()

  // 腮红
  ctx.globalAlpha = 0.6
  ell(122, 118, 16, 10, -0.1, '#ff9ab8'); ell(198, 118, 16, 10, 0.1, '#ff9ab8')
  ctx.globalAlpha = 1
  ctx.fillStyle = 'rgba(255,255,255,.8)'
  circ(117, 114, 2.2, 'rgba(255,255,255,.8)'); circ(193, 114, 2.2, 'rgba(255,255,255,.8)')

  // ω 嘴
  ctx.strokeStyle = '#5c4650'; ctx.lineWidth = 3.4
  ctx.beginPath(); ctx.moveTo(152, 122); ctx.quadraticCurveTo(156, 128, 160, 122); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(160, 122); ctx.quadraticCurveTo(164, 128, 168, 122); ctx.stroke()

  // 胡须
  ctx.strokeStyle = 'rgba(92,70,80,.55)'; ctx.lineWidth = 1.8
  for (const [y, sx] of [[110, -1], [120, -1], [130, -1]]) {
    ctx.beginPath(); ctx.moveTo(160 + sx * 46, y); ctx.lineTo(160 + sx * 72, y - 6); ctx.stroke()
    ctx.beginPath(); ctx.moveTo(160 - sx * 46, y); ctx.lineTo(160 - sx * 72, y - 6); ctx.stroke()
  }

  // 星星与爱心
  star(52, 42, 15, 5, '#ffe066')
  star(268, 52, 11, 5, '#ffffff')
  sparkle(276, 132, 13, '#fff2a8')
  sparkle(44, 128, 9, '#ffffff')
  heart(56, 92, 8, '#ff7ba6')
  heart(258, 90, 6, '#ff9bbd')
}

/* ================= S3-K4 极简线条小人：细黑线 + 白底 ================= */
function k4() {
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H)
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'

  ctx.strokeStyle = 'rgba(27,27,27,.35)'; ctx.lineWidth = 1
  ctx.beginPath(); ctx.moveTo(34, 146); ctx.lineTo(288, 146); ctx.stroke()

  ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 1.7
  // 头
  ctx.beginPath(); ctx.arc(150, 58, 11, 0, Math.PI * 2); ctx.stroke()
  // 身体
  ctx.beginPath(); ctx.moveTo(150, 69); ctx.lineTo(150, 112); ctx.stroke()
  // 手臂
  ctx.beginPath(); ctx.moveTo(150, 84); ctx.lineTo(127, 100); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(150, 84); ctx.lineTo(175, 96); ctx.stroke()
  // 腿
  ctx.beginPath(); ctx.moveTo(150, 112); ctx.lineTo(135, 145); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(150, 112); ctx.lineTo(166, 145); ctx.stroke()
  // 头发一小撮
  ctx.beginPath(); ctx.moveTo(142, 50); ctx.quadraticCurveTo(148, 44, 155, 49); ctx.stroke()

  // 运动线
  ctx.strokeStyle = 'rgba(27,27,27,.45)'; ctx.lineWidth = 1.3
  for (let i = 0; i < 3; i++) line(98 + i * 6, 96 + i * 9, 116 + i * 6, 96 + i * 9, 'rgba(27,27,27,.4)', 1.3)

  // 空对话气泡
  ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 1.7
  rr(196, 36, 78, 42, 12); ctx.stroke()
  poly([[214, 78], [210, 92], [228, 77]], '#1b1b1b')
  ctx.fillStyle = '#1b1b1b'
  circ(222, 57, 1.8, '#1b1b1b'); circ(235, 57, 1.8, '#1b1b1b'); circ(248, 57, 1.8, '#1b1b1b')

  // 唯一红点
  circ(262, 122, 5, '#e23b2e')
}

/* ================= S3-K5 孟菲斯扁平人：几何拼贴 ================= */
function k5() {
  ctx.fillStyle = '#fbf7ec'; ctx.fillRect(0, 0, W, H)

  // 背景几何拼贴
  ctx.strokeStyle = '#141414'; ctx.lineWidth = 2.4; ctx.lineCap = 'round'
  ctx.beginPath(); ctx.moveTo(20, 40); ctx.bezierCurveTo(32, 20, 42, 56, 54, 34); ctx.stroke()
  ctx.fillStyle = '#2ec4f1'
  for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) circ(248 + i * 13, 30 + j * 13, 3.3, '#2ec4f1')
  ctx.strokeStyle = '#141414'; ctx.lineWidth = 2
  ctx.beginPath(); ctx.moveTo(200, 148); ctx.lineTo(222, 118); ctx.lineTo(244, 148); ctx.closePath(); ctx.stroke()
  ctx.strokeStyle = '#ff5d8f'; ctx.lineWidth = 3
  ctx.beginPath(); ctx.arc(46, 150, 16, Math.PI, 0); ctx.stroke()
  ctx.fillStyle = '#ffd23f'; circ(290, 78, 8, '#ffd23f')
  ctx.strokeStyle = '#141414'; ctx.lineWidth = 2.4
  line(276, 132, 292, 132, '#141414', 2.4); line(284, 124, 284, 140, '#141414', 2.4)

  // 腿
  ctx.fillStyle = '#2ec4f1'
  rr(140, 124, 11, 36, 3); ctx.fill()
  rr(163, 124, 11, 36, 3); ctx.fill()
  ell(145, 160, 12, 5, 0, '#ffd23f'); ell(168, 160, 12, 5, 0, '#ffd23f')
  // 三角躯干
  poly([[157, 74], [120, 126], [194, 126]], '#ff5d8f')
  // 折线手臂
  ctx.strokeStyle = '#2ec4f1'; ctx.lineWidth = 8; ctx.lineJoin = 'round'
  ctx.beginPath(); ctx.moveTo(136, 90); ctx.lineTo(108, 76); ctx.lineTo(116, 100); ctx.stroke()
  ctx.strokeStyle = '#141414'; ctx.lineWidth = 2
  ctx.beginPath(); ctx.moveTo(180, 90); ctx.lineTo(208, 104); ctx.stroke()
  circ(157, 54, 23, '#ffffff')
  ctx.strokeStyle = '#141414'; ctx.lineWidth = 2.6
  ctx.beginPath(); ctx.arc(157, 52, 23, 0, Math.PI * 2); ctx.stroke()
  ctx.fillStyle = '#141414'
  ctx.beginPath(); ctx.arc(157, 50, 23, Math.PI, 0); ctx.fill()
  circ(149, 58, 2.4, '#141414'); circ(165, 58, 2.4, '#141414')
  ctx.strokeStyle = '#141414'; ctx.lineWidth = 2.2
  ctx.beginPath(); ctx.arc(157, 64, 6, 0.2, Math.PI - 0.2); ctx.stroke()
  circ(213, 106, 9, '#ffd23f')
  // 小块点缀
  star(72, 92, 8, 5, '#7ee081')
}

/* ================= S3-K6 清线漫画：干净墨线 + 少量网点 ================= */
function k6() {
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H)
  // 面板边框
  ctx.strokeStyle = '#141414'; ctx.lineWidth = 3
  ctx.strokeRect(5, 5, W - 10, H - 10)

  // 网点角落
  ctx.save(); ctx.beginPath(); ctx.rect(200, 8, 112, 46); ctx.clip()
  dots(198, 6, 118, 50, 6.5, 1.5, 'rgba(18,18,18,.16)')
  ctx.restore()

  // 后脑头发（黑色块）
  ctx.fillStyle = '#141414'
  ctx.beginPath()
  ctx.moveTo(122, 40)
  ctx.bezierCurveTo(88, 34, 62, 62, 64, 96)
  ctx.bezierCurveTo(66, 122, 80, 140, 100, 148)
  ctx.lineTo(112, 146)
  ctx.bezierCurveTo(92, 132, 82, 112, 84, 92)
  ctx.bezierCurveTo(86, 68, 104, 54, 128, 56)
  ctx.closePath(); ctx.fill()

  // 侧脸
  ctx.beginPath()
  ctx.moveTo(126, 44)
  ctx.bezierCurveTo(146, 48, 150, 62, 150, 72)
  ctx.lineTo(160, 80)
  ctx.lineTo(150, 84)
  ctx.quadraticCurveTo(156, 88, 152, 92)
  ctx.quadraticCurveTo(156, 96, 149, 97)
  ctx.quadraticCurveTo(152, 106, 143, 112)
  ctx.quadraticCurveTo(132, 120, 118, 120)
  ctx.lineTo(118, 146)
  ctx.lineTo(100, 146)
  ctx.bezierCurveTo(96, 128, 96, 112, 100, 100)
  ctx.bezierCurveTo(94, 78, 104, 56, 126, 44)
  ctx.closePath()
  ctx.fillStyle = '#ffffff'; ctx.fill()
  ctx.strokeStyle = '#141414'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.stroke()

  // 头发高光
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3; ctx.lineCap = 'round'
  ctx.beginPath(); ctx.moveTo(84, 78); ctx.quadraticCurveTo(78, 104, 92, 124); ctx.stroke()
  ctx.lineWidth = 1.6
  ctx.beginPath(); ctx.moveTo(96, 52); ctx.quadraticCurveTo(80, 66, 76, 88); ctx.stroke()

  // 眼睛
  ctx.beginPath()
  ctx.moveTo(118, 83)
  ctx.quadraticCurveTo(128, 75, 140, 80)
  ctx.quadraticCurveTo(130, 88, 118, 83)
  ctx.closePath(); ctx.fillStyle = '#141414'; ctx.fill()
  circ(131, 82, 2.1, '#ffffff')
  ctx.strokeStyle = '#141414'; ctx.lineWidth = 2.4
  ctx.beginPath(); ctx.moveTo(115, 80); ctx.quadraticCurveTo(128, 71, 142, 78); ctx.stroke()
  // 眉毛
  ctx.lineWidth = 1.8
  ctx.beginPath(); ctx.moveTo(116, 68); ctx.quadraticCurveTo(128, 63, 140, 67); ctx.stroke()
  // 鼻下阴影线
  ctx.lineWidth = 1.4
  line(151, 84, 147, 86, '#141414', 1.4)

  // 脖子/下巴网点
  ctx.save()
  ctx.beginPath(); ctx.moveTo(112, 110); ctx.lineTo(134, 110); ctx.lineTo(126, 136); ctx.lineTo(112, 130); ctx.closePath(); ctx.clip()
  dots(108, 104, 40, 40, 4.6, 1.1, 'rgba(18,18,18,.5)')
  ctx.restore()

  // 衣领/肩
  ctx.strokeStyle = '#141414'; ctx.lineWidth = 2.2
  ctx.beginPath(); ctx.moveTo(104, 146); ctx.quadraticCurveTo(110, 152, 118, 148); ctx.lineTo(122, 162); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(96, 148); ctx.quadraticCurveTo(120, 158, 146, 150); ctx.stroke()

  // 速度线
  ctx.strokeStyle = 'rgba(20,20,20,.5)'; ctx.lineWidth = 1.3
  for (let i = 0; i < 3; i++) line(38, 84 + i * 9, 54, 82 + i * 9, 'rgba(20,20,20,.5)', 1.3)

  // 对话气泡
  ctx.strokeStyle = '#141414'; ctx.lineWidth = 2
  ctx.fillStyle = '#ffffff'
  rr(196, 86, 92, 46, 16); ctx.fill(); ctx.stroke()
  poly([[196, 104], [184, 112], [197, 114]], '#ffffff')
  ctx.strokeStyle = '#141414'
  ctx.beginPath(); ctx.moveTo(196, 104); ctx.lineTo(184, 112); ctx.lineTo(197, 114); ctx.stroke()
  ctx.fillStyle = '#141414'
  circ(222, 109, 2.2, '#141414'); circ(240, 109, 2.2, '#141414'); circ(258, 109, 2.2, '#141414')
}

/* ================= S3-K7 日式动画：赛璐璐 + 高光 ================= */
function eyeAnime(cx, cy, rx, ry) {
  ctx.beginPath()
  ctx.moveTo(cx - rx, cy + 1)
  ctx.quadraticCurveTo(cx, cy - ry, cx + rx, cy)
  ctx.quadraticCurveTo(cx, cy + ry * 0.95, cx - rx, cy + 1)
  ctx.closePath()
}
function k7() {
  const g = ctx.createLinearGradient(0, 0, 0, H)
  g.addColorStop(0, '#6fc0ee'); g.addColorStop(0.55, '#bfe6fb'); g.addColorStop(1, '#eef9ff')
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H)

  // 云
  const cloud = (x, y, s, a) => {
    ctx.globalAlpha = a
    ctx.beginPath()
    ctx.arc(x, y, 11 * s, 0, Math.PI * 2)
    ctx.arc(x + 14 * s, y - 7 * s, 14 * s, 0, Math.PI * 2)
    ctx.arc(x + 32 * s, y - 1 * s, 11 * s, 0, Math.PI * 2)
    ctx.arc(x + 15 * s, y + 4 * s, 11 * s, 0, Math.PI * 2)
    ctx.fillStyle = '#ffffff'; ctx.fill()
    ctx.globalAlpha = 1
  }
  cloud(16, 44, 0.75, 0.85); cloud(214, 66, 1, 0.7); cloud(112, 22, 0.55, 0.55)

  // 阳光光斑
  const rg = ctx.createRadialGradient(272, 18, 2, 272, 18, 78)
  rg.addColorStop(0, 'rgba(255,255,255,.95)'); rg.addColorStop(0.4, 'rgba(255,250,210,.45)'); rg.addColorStop(1, 'rgba(255,255,255,0)')
  ctx.fillStyle = rg; ctx.fillRect(180, 0, 140, 130)
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2
